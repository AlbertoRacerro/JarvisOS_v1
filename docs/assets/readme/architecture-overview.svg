<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">JarvisOS architecture overview</title>
  <desc id="desc">The engineer interacts with the frontend and Jarvis authority core. AI runtimes propose work while deterministic engineering tools execute calculations. Process simulation is the first BlueRev engineering priority, followed by process design, physical CAD realization, and qualified numerical verification. Evidence returns to canonical JarvisOS state.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .box { fill:#f8fafc; stroke:#475569; stroke-width:2; rx:16; }
      .core { fill:#ecfdf5; stroke:#15803d; stroke-width:3; rx:18; }
      .p1 { fill:#f0fdf4; stroke:#16a34a; stroke-width:3; rx:16; }
      .p2 { fill:#f8fafc; stroke:#0f766e; stroke-width:2.5; rx:16; }
      .txt { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; fill:#0f172a; font-size:22px; font-weight:650; }
      .sub { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; fill:#475569; font-size:16px; font-weight:450; }
      .label { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; fill:#166534; font-size:15px; font-weight:750; letter-spacing:.4px; }
      .line { stroke:#475569; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#64748b; stroke-width:2; fill:none; stroke-dasharray:8 7; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect x="35" y="35" width="1130" height="650" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="82" class="txt" font-size="28">JarvisOS — local-first AI co-engineering architecture</text>
  <text x="70" y="110" class="sub">AI proposes; JarvisOS owns authority, canonical state and evidence; deterministic engines perform engineering work.</text>

  <rect x="70" y="155" width="190" height="100" class="box"/>
  <text x="165" y="193" text-anchor="middle" class="txt">Engineer</text>
  <text x="165" y="220" text-anchor="middle" class="sub">goals · constraints</text>
  <text x="165" y="242" text-anchor="middle" class="sub">review · acceptance</text>

  <rect x="330" y="145" width="250" height="120" class="box"/>
  <text x="455" y="187" text-anchor="middle" class="txt">Frontend</text>
  <text x="455" y="216" text-anchor="middle" class="sub">React · TypeScript · Three.js</text>
  <text x="455" y="240" text-anchor="middle" class="sub">workbenches · inspection</text>

  <rect x="665" y="135" width="420" height="140" class="core"/>
  <text x="875" y="178" text-anchor="middle" class="txt">JarvisOS authority core</text>
  <text x="875" y="208" text-anchor="middle" class="sub">state · policy · routing · egress · provenance</text>
  <text x="875" y="232" text-anchor="middle" class="sub">evidence · budgets · grants · acceptance</text>
  <text x="875" y="258" text-anchor="middle" class="label">CANONICAL AUTHORITY</text>

  <path d="M260 205 H330" class="line"/>
  <path d="M580 205 H665" class="line"/>

  <rect x="70" y="330" width="260" height="125" class="box"/>
  <text x="200" y="369" text-anchor="middle" class="txt">AI runtimes</text>
  <text x="200" y="398" text-anchor="middle" class="sub">local models by default</text>
  <text x="200" y="422" text-anchor="middle" class="sub">external specialists when allowed</text>
  <text x="200" y="446" text-anchor="middle" class="label">PROPOSAL / ADVISORY</text>

  <rect x="385" y="320" width="300" height="145" class="p1"/>
  <text x="535" y="353" text-anchor="middle" class="label">BLUEREV P1</text>
  <text x="535" y="385" text-anchor="middle" class="txt">Process simulation</text>
  <text x="535" y="414" text-anchor="middle" class="sub">biology · light · mixing · shear</text>
  <text x="535" y="438" text-anchor="middle" class="sub">gas transfer · nutrients · energy</text>

  <rect x="760" y="320" width="300" height="145" class="p1"/>
  <text x="910" y="353" text-anchor="middle" class="label">BLUEREV P1b</text>
  <text x="910" y="385" text-anchor="middle" class="txt">Process design</text>
  <text x="910" y="414" text-anchor="middle" class="sub">diameter · length · topology</text>
  <text x="910" y="438" text-anchor="middle" class="sub">flow · aeration · constraints</text>

  <rect x="385" y="535" width="300" height="110" class="p2"/>
  <text x="535" y="568" text-anchor="middle" class="label">BLUEREV P2</text>
  <text x="535" y="599" text-anchor="middle" class="txt">BLUECAD</text>
  <text x="535" y="625" text-anchor="middle" class="sub">physical realization · manufacturability</text>

  <rect x="760" y="535" width="300" height="110" class="box"/>
  <text x="910" y="568" text-anchor="middle" class="label">QUALIFIED ENGINES</text>
  <text x="910" y="599" text-anchor="middle" class="txt">Mesh / CFD / FEM</text>
  <text x="910" y="625" text-anchor="middle" class="sub">Gmsh · CalculiX · future adapters</text>

  <path d="M330 392 C365 392 350 250 665 235" class="dash"/>
  <text x="435" y="295" class="sub">proposals</text>

  <path d="M875 275 C875 300 665 288 535 320" class="line"/>
  <path d="M685 392 H760" class="line"/>
  <path d="M910 465 C910 500 700 505 535 535" class="line"/>
  <path d="M685 590 H760" class="line"/>
  <path d="M1060 590 C1120 590 1120 245 1085 225" class="line"/>

  <text x="1115" y="430" transform="rotate(-90 1115 430)" class="sub">results · diagnostics · evidence</text>
</svg>
