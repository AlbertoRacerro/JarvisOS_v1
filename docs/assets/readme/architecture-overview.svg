<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">JarvisOS high-level architecture</title>
  <desc id="desc">Engineer interacts with JarvisOS. Jarvis authority controls policy and canonical state. Replaceable AI and engineering backends execute bounded work and return evidence.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>
      .frame{fill:#fff;stroke:#cbd5e1;stroke-width:2}.implemented{fill:#ecfdf5;stroke:#16a34a;stroke-width:2.5}.partial{fill:#fffbeb;stroke:#d97706;stroke-width:2.5}.planned{fill:#eff6ff;stroke:#0284c7;stroke-width:2.5}.optional{fill:#f8fafc;stroke:#64748b;stroke-width:2}.title{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a;font-size:27px;font-weight:750}.boxTitle{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a;font-size:20px;font-weight:700}.sub{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#475569;font-size:14px}.tag{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:12px;font-weight:800}.line{stroke:#475569;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="30" y="30" width="1140" height="500" rx="22" class="frame"/>
  <text x="65" y="74" class="title">JarvisOS — the simple view</text>
  <text x="65" y="101" class="sub">One authority layer, many replaceable runtimes and engineering tools.</text>

  <rect x="70" y="175" width="180" height="120" rx="16" class="implemented"/>
  <text x="160" y="215" text-anchor="middle" class="boxTitle">Engineer</text>
  <text x="160" y="245" text-anchor="middle" class="sub">goals · constraints</text>
  <text x="160" y="268" text-anchor="middle" class="sub">review · acceptance</text>

  <rect x="360" y="145" width="350" height="180" rx="18" class="implemented"/>
  <text x="535" y="187" text-anchor="middle" class="boxTitle">JarvisOS authority core</text>
  <text x="535" y="221" text-anchor="middle" class="sub">deterministic policy · canonical state</text>
  <text x="535" y="246" text-anchor="middle" class="sub">routing · privacy/egress · budgets</text>
  <text x="535" y="271" text-anchor="middle" class="sub">runs · artifacts · evidence · acceptance</text>
  <text x="535" y="301" text-anchor="middle" class="tag" fill="#15803d">IMPLEMENTED FOUNDATION</text>

  <rect x="820" y="125" width="300" height="115" rx="16" class="planned"/>
  <text x="970" y="164" text-anchor="middle" class="boxTitle">AI / agent layer</text>
  <text x="970" y="194" text-anchor="middle" class="sub">models · AgentRuntime · MCP · code intelligence</text>
  <text x="970" y="219" text-anchor="middle" class="tag" fill="#0369a1">MIX OF CURRENT + PLANNED</text>

  <rect x="820" y="310" width="300" height="115" rx="16" class="partial"/>
  <text x="970" y="349" text-anchor="middle" class="boxTitle">Engineering backends</text>
  <text x="970" y="379" text-anchor="middle" class="sub">process · CAD · mesh · FEM · CFD · specialist tools</text>
  <text x="970" y="404" text-anchor="middle" class="tag" fill="#b45309">MIXED MATURITY</text>

  <rect x="360" y="395" width="350" height="95" rx="16" class="implemented"/>
  <text x="535" y="431" text-anchor="middle" class="boxTitle">Evidence back to Jarvis</text>
  <text x="535" y="458" text-anchor="middle" class="sub">results · provenance · diagnostics · acceptance status</text>

  <path d="M250 235 H360" class="line"/>
  <path d="M710 205 H820" class="line"/>
  <path d="M710 270 C760 270 770 367 820 367" class="line"/>
  <path d="M820 388 C760 430 745 443 710 443" class="line"/>
  <path d="M535 395 V325" class="line"/>

  <text x="760" y="190" class="sub">bounded task / context</text>
  <text x="745" y="425" class="sub">outputs / evidence</text>
</svg>
