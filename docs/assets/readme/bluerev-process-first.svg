<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" role="img" aria-labelledby="title desc">
  <title id="title">BlueRev process-first iterative engineering loop</title>
  <desc id="desc">BlueRev begins with goals and constraints. Jarvis orchestrates an iterative loop between a search or optimization layer and an integrated photobioreactor process evaluator. Process results return to Jarvis after every evaluation. Only after a feasible or optimal process envelope is accepted does the workflow move into BLUECAD physical realization, mesh or higher-fidelity verification, and evidence. Geometry or verification can trigger another Jarvis-controlled process iteration.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c2410c"/></marker>
    <style>
      .canvas{fill:#ffffff;stroke:#cbd5e1;stroke-width:2}
      .implemented{fill:#ecfdf5;stroke:#16a34a;stroke-width:2.5}
      .partial{fill:#fffbeb;stroke:#d97706;stroke-width:2.5}
      .planned{fill:#fff7ed;stroke:#ea580c;stroke-width:2.5}
      .research{fill:#fef2f2;stroke:#dc2626;stroke-width:2.5}
      .neutral{fill:#f8fafc;stroke:#64748b;stroke-width:2.2}
      .title{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a;font-size:31px;font-weight:750}
      .subtitle{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#475569;font-size:16px}
      .h2{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a;font-size:21px;font-weight:700}
      .body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#334155;font-size:14px;font-weight:480}
      .tiny{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#475569;font-size:12px;font-weight:500}
      .chip{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:11px;font-weight:800;letter-spacing:.4px}
      .band{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#64748b;font-size:13px;font-weight:800;letter-spacing:1px}
      .line{stroke:#475569;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
      .loop{stroke:#c2410c;stroke-width:3;fill:none;marker-end:url(#arrowOrange)}
      .dash{stroke:#94a3b8;stroke-width:2.1;fill:none;stroke-dasharray:7 7;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect x="24" y="24" width="1552" height="972" rx="26" class="canvas"/>
  <text x="64" y="72" class="title">BlueRev — process first, with Jarvis in the loop</text>
  <text x="64" y="101" class="subtitle">Process simulation is not a one-way pipe into CAD. Jarvis sees every result, changes the next candidate, and iterates until a useful process envelope exists.</text>

  <g transform="translate(64 124)">
    <rect x="0" y="0" width="116" height="30" rx="15" class="implemented"/><text x="58" y="20" text-anchor="middle" class="chip" fill="#166534">IMPLEMENTED</text>
    <rect x="128" y="0" width="145" height="30" rx="15" class="partial"/><text x="200" y="20" text-anchor="middle" class="chip" fill="#92400e">PARTIAL / QUALIFY</text>
    <rect x="285" y="0" width="103" height="30" rx="15" class="planned"/><text x="337" y="20" text-anchor="middle" class="chip" fill="#9a3412">PLANNED</text>
    <rect x="400" y="0" width="104" height="30" rx="15" class="research"/><text x="452" y="20" text-anchor="middle" class="chip" fill="#991b1b">RESEARCH</text>
  </g>

  <rect x="64" y="196" width="250" height="112" rx="16" class="neutral"/>
  <text x="189" y="231" text-anchor="middle" class="h2">Goals + constraints</text>
  <text x="189" y="258" text-anchor="middle" class="body">productivity · viability · cost</text>
  <text x="189" y="281" text-anchor="middle" class="body">energy · footprint · limits</text>
  <text x="189" y="301" text-anchor="middle" class="tiny">engineer defines what matters</text>

  <rect x="374" y="176" width="360" height="152" rx="18" class="implemented"/>
  <text x="554" y="211" text-anchor="middle" class="band" fill="#166534">JARVIS ORCHESTRATION + AUTHORITY</text>
  <text x="554" y="239" text-anchor="middle" class="h2">Jarvis reviews each result</text>
  <text x="554" y="263" text-anchor="middle" class="h2">and chooses the next move</text>
  <text x="554" y="290" text-anchor="middle" class="body">constraints · assumptions · evidence · acceptance</text>
  <text x="554" y="313" text-anchor="middle" class="tiny">AI may suggest; Jarvis keeps state and decision authority</text>

  <rect x="794" y="196" width="286" height="112" rx="16" class="planned"/>
  <text x="937" y="231" text-anchor="middle" class="h2">P1b — search / optimizer</text>
  <text x="937" y="258" text-anchor="middle" class="body">DOE · bounded search · later Pareto</text>
  <text x="937" y="281" text-anchor="middle" class="body">proposes the next process candidate</text>
  <text x="937" y="301" text-anchor="middle" class="tiny">starts simple; higher automation later</text>

  <rect x="1140" y="176" width="396" height="152" rx="18" class="planned"/>
  <text x="1338" y="211" text-anchor="middle" class="band" fill="#9a3412">P1 — PRIMARY BLUEREV ENGINEERING CAPABILITY</text>
  <text x="1338" y="244" text-anchor="middle" class="h2">Integrated photobioreactor evaluator</text>
  <text x="1338" y="272" text-anchor="middle" class="body">biology · light · photoinhibition · mixing / shear</text>
  <text x="1338" y="295" text-anchor="middle" class="body">CO₂ / O₂ transfer · nutrients · hydraulics · energy</text>
  <text x="1338" y="316" text-anchor="middle" class="tiny">partial process/hydraulic foundations exist; integrated BlueRev model does not yet</text>

  <path d="M314 252 H374" class="line"/>
  <path d="M734 252 H794" class="line"/>
  <path d="M1080 252 H1140" class="line"/>

  <path d="M1338 328 V388 H554 V328" class="loop"/>
  <text x="945" y="350" text-anchor="middle" class="body" fill="#9a3412">results · violations · productivity · ΔP · shear · gas transfer · energy</text>
  <text x="945" y="371" text-anchor="middle" class="tiny" fill="#9a3412">return to Jarvis after every evaluation</text>

  <text x="64" y="446" class="band">ONLY AFTER THE PROCESS LOOP FINDS A FEASIBLE / USEFUL REGION</text>
  <rect x="374" y="466" width="360" height="122" rx="18" class="planned"/>
  <text x="554" y="501" text-anchor="middle" class="h2">Accepted process-design envelope</text>
  <text x="554" y="529" text-anchor="middle" class="body">diameter range · total length · topology · flow</text>
  <text x="554" y="552" text-anchor="middle" class="body">gas / nutrient demand · shear / ΔP / energy limits</text>
  <text x="554" y="575" text-anchor="middle" class="tiny">not “a shape”; a set of engineering requirements and admissible ranges</text>

  <path d="M554 328 V466" class="line"/>
  <text x="570" y="430" class="tiny">accept / promote envelope</text>

  <rect x="806" y="466" width="300" height="122" rx="18" class="implemented"/>
  <text x="956" y="501" text-anchor="middle" class="h2">P2 — BLUECAD realization</text>
  <text x="956" y="529" text-anchor="middle" class="body">layout · bends · manifolds · supports</text>
  <text x="956" y="552" text-anchor="middle" class="body">interfaces · access · manufacturability</text>
  <text x="956" y="575" text-anchor="middle" class="tiny">physical geometry from process requirements</text>

  <rect x="1178" y="466" width="358" height="122" rx="18" class="partial"/>
  <text x="1357" y="501" text-anchor="middle" class="h2">Physical / field verification</text>
  <text x="1357" y="529" text-anchor="middle" class="body">Gmsh + CalculiX today</text>
  <text x="1357" y="552" text-anchor="middle" class="body">CFD / thermal / other solvers only when needed</text>
  <text x="1357" y="575" text-anchor="middle" class="tiny">implemented chain exists; scientific qualification remains case-specific</text>

  <path d="M734 527 H806" class="line"/>
  <path d="M1106 527 H1178" class="line"/>

  <rect x="806" y="670" width="300" height="116" rx="18" class="implemented"/>
  <text x="956" y="696" text-anchor="middle" class="h2">Jarvis evidence</text>
  <text x="956" y="720" text-anchor="middle" class="h2">+ decision state</text>
  <text x="956" y="746" text-anchor="middle" class="body">runs · artifacts · provenance · criteria</text>
  <text x="956" y="768" text-anchor="middle" class="tiny">accepted / rejected / another iteration</text>

  <path d="M1357 588 V728 H1106" class="line"/>
  <path d="M806 728 H330 V252 H374" class="loop"/>
  <text x="555" y="674" text-anchor="middle" class="tiny" fill="#9a3412">if geometry or verification changes process assumptions,</text>
  <text x="555" y="693" text-anchor="middle" class="tiny" fill="#9a3412">Jarvis reopens the P1/P1b loop</text>

  <rect x="64" y="842" width="470" height="112" rx="16" class="neutral"/>
  <text x="299" y="876" text-anchor="middle" class="h2">What CAD does not decide</text>
  <text x="299" y="903" text-anchor="middle" class="body">tube diameter · length · flow · topology are first process variables</text>
  <text x="299" y="926" text-anchor="middle" class="body">before they become geometry parameters</text>

  <rect x="565" y="842" width="470" height="112" rx="16" class="neutral"/>
  <text x="800" y="876" text-anchor="middle" class="h2">What “optimization” means here</text>
  <text x="800" y="901" text-anchor="middle" class="body">many deterministic evaluations</text>
  <text x="800" y="924" text-anchor="middle" class="tiny">Jarvis checks assumptions and evidence.</text>
  <text x="800" y="944" text-anchor="middle" class="tiny">The LLM does not invent the optimum.</text>

  <rect x="1066" y="842" width="470" height="112" rx="16" class="neutral"/>
  <text x="1301" y="876" text-anchor="middle" class="h2">What happens after P2</text>
  <text x="1301" y="903" text-anchor="middle" class="body">manufacturability and high-fidelity checks can still invalidate a design</text>
  <text x="1301" y="926" text-anchor="middle" class="body">and send it back through Jarvis rather than silently downstream</text>
</svg>
