<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">JarvisOS AI authority flow</title>
  <desc id="desc">AI proposes, deterministic policy authorizes, tools execute, evidence returns and Jarvis accepts or rejects before canonical state changes.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
  <style>.frame{fill:#fff;stroke:#cbd5e1;stroke-width:2}.implemented{fill:#ecfdf5;stroke:#16a34a;stroke-width:2.5}.optional{fill:#f8fafc;stroke:#64748b;stroke-width:2}.title{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a;font-size:26px;font-weight:750}.boxTitle{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a;font-size:18px;font-weight:700}.sub{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#475569;font-size:13px}.line{stroke:#475569;stroke-width:2.3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect x="30" y="30" width="1140" height="370" rx="22" class="frame"/>
  <text x="65" y="73" class="title">AI is useful without being the authority</text>
  <text x="65" y="100" class="sub">The important boundary is what gets permission to run, and what gets accepted as project truth.</text>
  <rect x="60" y="155" width="175" height="100" rx="15" class="optional"/><text x="148" y="191" text-anchor="middle" class="boxTitle">AI / agent</text><text x="148" y="219" text-anchor="middle" class="sub">proposal</text>
  <rect x="285" y="140" width="230" height="130" rx="15" class="implemented"/><text x="400" y="176" text-anchor="middle" class="boxTitle">Deterministic policy</text><text x="400" y="204" text-anchor="middle" class="sub">permissions · privacy · budget</text><text x="400" y="227" text-anchor="middle" class="sub">capability · validation</text><text x="400" y="250" text-anchor="middle" class="sub">fail closed</text>
  <rect x="565" y="155" width="175" height="100" rx="15" class="optional"/><text x="653" y="191" text-anchor="middle" class="boxTitle">Tool / solver</text><text x="653" y="219" text-anchor="middle" class="sub">bounded execution</text>
  <rect x="790" y="155" width="175" height="100" rx="15" class="implemented"/><text x="878" y="191" text-anchor="middle" class="boxTitle">Evidence</text><text x="878" y="219" text-anchor="middle" class="sub">result · provenance</text>
  <rect x="1015" y="140" width="130" height="130" rx="15" class="implemented"/><text x="1080" y="178" text-anchor="middle" class="boxTitle">Jarvis</text><text x="1080" y="205" text-anchor="middle" class="sub">accept</text><text x="1080" y="228" text-anchor="middle" class="sub">reject</text><text x="1080" y="251" text-anchor="middle" class="sub">commit state</text>
  <path d="M235 205 H285" class="line"/><path d="M515 205 H565" class="line"/><path d="M740 205 H790" class="line"/><path d="M965 205 H1015" class="line"/>
  <path d="M1080 270 C1080 335 400 345 400 270" class="line"/>
  <text x="720" y="335" class="sub">accepted evidence may update canonical state; raw output does not</text>
</svg>
