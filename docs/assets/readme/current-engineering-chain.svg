<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Current CAD to FEM engineering chain</title>
  <desc id="desc">Current implemented physical-design path from GeometrySpec through build123d and OpenCascade to artifacts, Gmsh, CalculiX, runs and evidence.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
  <style>.frame{fill:#fff;stroke:#cbd5e1;stroke-width:2}.implemented{fill:#ecfdf5;stroke:#16a34a;stroke-width:2.4}.partial{fill:#fffbeb;stroke:#d97706;stroke-width:2.4}.title{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a;font-size:26px;font-weight:750}.boxTitle{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a;font-size:17px;font-weight:700}.sub{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#475569;font-size:12px}.tag{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:11px;font-weight:800}.line{stroke:#475569;stroke-width:2.3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect x="30" y="30" width="1140" height="370" rx="22" class="frame"/>
  <text x="65" y="73" class="title">A physical-design path that already exists</text>
  <text x="65" y="100" class="sub">Useful current infrastructure — not a claim that every engineering workflow should begin with CAD.</text>
  <rect x="55" y="155" width="145" height="100" rx="14" class="implemented"/><text x="128" y="188" text-anchor="middle" class="boxTitle">GeometrySpec</text><text x="128" y="214" text-anchor="middle" class="sub">semantic CAD input</text><text x="128" y="239" text-anchor="middle" class="tag" fill="#15803d">WORKING</text>
  <rect x="235" y="155" width="155" height="100" rx="14" class="implemented"/><text x="313" y="188" text-anchor="middle" class="boxTitle">build123d / OCCT</text><text x="313" y="214" text-anchor="middle" class="sub">B-Rep geometry</text><text x="313" y="239" text-anchor="middle" class="tag" fill="#15803d">WORKING</text>
  <rect x="425" y="155" width="145" height="100" rx="14" class="implemented"/><text x="498" y="188" text-anchor="middle" class="boxTitle">Artifacts</text><text x="498" y="214" text-anchor="middle" class="sub">STEP · STL · GLB</text><text x="498" y="239" text-anchor="middle" class="tag" fill="#15803d">WORKING</text>
  <rect x="605" y="155" width="135" height="100" rx="14" class="partial"/><text x="673" y="188" text-anchor="middle" class="boxTitle">Gmsh</text><text x="673" y="214" text-anchor="middle" class="sub">mesh · groups</text><text x="673" y="239" text-anchor="middle" class="tag" fill="#b45309">QUALIFY</text>
  <rect x="775" y="155" width="135" height="100" rx="14" class="partial"/><text x="843" y="188" text-anchor="middle" class="boxTitle">CalculiX</text><text x="843" y="214" text-anchor="middle" class="sub">static FEM</text><text x="843" y="239" text-anchor="middle" class="tag" fill="#b45309">QUALIFY</text>
  <rect x="945" y="155" width="190" height="100" rx="14" class="implemented"/><text x="1040" y="188" text-anchor="middle" class="boxTitle">Runs + evidence</text><text x="1040" y="214" text-anchor="middle" class="sub">results · provenance · UI</text><text x="1040" y="239" text-anchor="middle" class="tag" fill="#15803d">WORKING SPINE</text>
  <path d="M200 205 H235" class="line"/><path d="M390 205 H425" class="line"/><path d="M570 205 H605" class="line"/><path d="M740 205 H775" class="line"/><path d="M910 205 H945" class="line"/>
  <rect x="300" y="305" width="600" height="55" rx="14" class="partial"/>
  <text x="600" y="329" text-anchor="middle" class="sub">Gmsh and CalculiX adapters exist; exact executable/host qualification and scientific validation remain separate gates.</text>
  <text x="600" y="350" text-anchor="middle" class="sub">The point is to keep this path and harden it, not rebuild it from scratch.</text>
</svg>
