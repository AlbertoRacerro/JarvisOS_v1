<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">Microalgae photobioreactor design-study architecture</title>
  <desc id="desc">The engineer and Jarvis operate in the outer loop. A deterministic study controller manages design variables and state. DOE or optimization proposes candidates, the PBR evaluator returns typed results, and the controller decides feasibility and selection. Only a selected feasible design becomes a ProcessDesignEnvelope for detailed CAD. Higher-fidelity physical verification can reopen the same study.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>.frame{fill:#fff;stroke:#cbd5e1;stroke-width:2}.implemented{fill:#ecfdf5;stroke:#16a34a;stroke-width:2.5}.partial{fill:#fffbeb;stroke:#d97706;stroke-width:2.5}.planned{fill:#eff6ff;stroke:#0284c7;stroke-width:2.5}.optional{fill:#f8fafc;stroke:#64748b;stroke-width:2}.title{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a;font-size:27px;font-weight:750}.boxTitle{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a;font-size:16.5px;font-weight:700}.sub{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#475569;font-size:11.5px}.tag{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:10.5px;font-weight:800}.line{stroke:#475569;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.loop{stroke:#0284c7;stroke-width:2.7;fill:none;marker-end:url(#arrow)}.lane{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}</style>
  </defs>
  <rect id="frame" x="30" y="30" width="1140" height="800" rx="22" class="frame"/>
  <text x="65" y="74" class="title">Photobioreactor design: Jarvis outside the tight numerical loop</text>
  <text x="65" y="101" class="sub">Jarvis helps define and interpret the study. A deterministic controller and optimizer own the per-candidate numerical loop.</text>

  <g id="card-engineer"><rect id="rect-engineer" x="60" y="145" width="200" height="110" rx="16" class="implemented"/>
    <text x="160" y="180" text-anchor="middle" class="boxTitle">Engineer</text><text x="160" y="209" text-anchor="middle" class="sub">goals · constraints · review</text><text x="160" y="232" text-anchor="middle" class="sub">final engineering responsibility</text></g>

  <g id="card-jarvis"><rect id="rect-jarvis" x="330" y="145" width="245" height="110" rx="16" class="implemented"/>
    <text x="452.5" y="180" text-anchor="middle" class="boxTitle">Jarvis outer loop</text><text x="452.5" y="209" text-anchor="middle" class="sub">context · interpretation · strategy</text><text x="452.5" y="232" text-anchor="middle" class="sub">change study · explain · intervene</text></g>

  <g id="card-studydef"><rect id="rect-studydef" x="650" y="145" width="240" height="110" rx="16" class="planned"/>
    <text x="770" y="180" text-anchor="middle" class="boxTitle">Typed DesignStudy</text><text x="770" y="209" text-anchor="middle" class="sub">variables · bounds · objectives</text><text x="770" y="232" text-anchor="middle" class="sub">constraints · fidelity policy</text></g>

  <g id="card-controller"><rect id="rect-controller" x="955" y="145" width="180" height="110" rx="16" class="planned"/>
    <text x="1045" y="180" text-anchor="middle" class="boxTitle">StudyController</text><text x="1045" y="209" text-anchor="middle" class="sub">state · feasibility</text><text x="1045" y="232" text-anchor="middle" class="sub">selection · history</text></g>

  <path d="M260 185 H330" class="line"/><path d="M330 225 H260" class="line"/>
  <path d="M575 185 H650" class="line"/><path d="M650 225 H575" class="line"/>
  <path d="M890 200 H955" class="line"/>
  <path d="M955 235 H900 C840 235 820 255 770 255" class="line"/><text x="835" y="276" class="sub">study summary / status</text>

  <rect x="55" y="310" width="1090" height="245" rx="20" class="lane"/>
  <text x="80" y="342" class="boxTitle">Deterministic numerical study</text>
  <text x="80" y="365" class="sub">No LLM is required for each candidate evaluation.</text>

  <g id="card-optimizer"><rect id="rect-optimizer" x="110" y="395" width="230" height="110" rx="16" class="planned"/>
    <text x="225" y="431" text-anchor="middle" class="boxTitle">DOE / optimizer / search</text><text x="225" y="460" text-anchor="middle" class="sub">proposes next candidate</text><text x="225" y="483" text-anchor="middle" class="sub">from study state + results</text></g>

  <g id="card-evaluator"><rect id="rect-evaluator" x="420" y="385" width="350" height="130" rx="17" class="planned"/>
    <text x="595" y="421" text-anchor="middle" class="boxTitle">PBR EngineeringEvaluator(s)</text><text x="595" y="450" text-anchor="middle" class="sub">biology · light · mixing/shear · gas transfer</text><text x="595" y="473" text-anchor="middle" class="sub">nutrients/control · hydraulics · energy</text><text x="595" y="497" text-anchor="middle" class="tag" fill="#0369a1">TARGET · CURRENT M0/M1 SCREENS ARE PARTIAL INPUTS</text></g>

  <g id="card-result"><rect id="rect-result" x="850" y="395" width="240" height="110" rx="16" class="planned"/>
    <text x="970" y="431" text-anchor="middle" class="boxTitle">EvaluationResult</text><text x="970" y="460" text-anchor="middle" class="sub">metrics · constraints · failures</text><text x="970" y="483" text-anchor="middle" class="sub">evidence · fidelity metadata</text></g>

  <path d="M340 450 H420" class="line"/><text x="355" y="435" class="sub">candidate</text>
  <path d="M770 450 H850" class="line"/>
  <path d="M1090 450 H1108 V255" class="loop"/><text x="1008" y="366" class="sub" fill="#0369a1">result → controller</text>
  <path d="M955 235 C850 270 520 285 340 395" class="line"/><text x="650" y="296" class="sub">study state → optimizer</text>

  <g id="card-envelope"><rect id="rect-envelope" x="65" y="650" width="290" height="120" rx="16" class="planned"/>
    <text x="210" y="687" text-anchor="middle" class="boxTitle">ProcessDesignEnvelope</text><text x="210" y="716" text-anchor="middle" class="sub">process-driving geometry · flows</text><text x="210" y="740" text-anchor="middle" class="sub">pressure / shear / transfer / energy limits</text></g>

  <g id="card-cad"><rect id="rect-cad" x="430" y="650" width="270" height="120" rx="16" class="implemented"/>
    <text x="565" y="687" text-anchor="middle" class="boxTitle">Detailed CAD layer</text><text x="565" y="716" text-anchor="middle" class="sub">current parametric CAD foundation</text><text x="565" y="740" text-anchor="middle" class="sub">physical realization · layout</text></g>

  <g id="card-verify"><rect id="rect-verify" x="775" y="635" width="360" height="150" rx="16" class="partial"/>
    <text x="955" y="674" text-anchor="middle" class="boxTitle">Higher-fidelity physical verification</text><text x="955" y="703" text-anchor="middle" class="sub">mesh · FEM · CFD · manufacturing checks</text><text x="955" y="727" text-anchor="middle" class="sub">only when a decision needs more fidelity</text><text x="955" y="751" text-anchor="middle" class="sub">CFD may also act earlier as a study evaluator</text></g>

  <path d="M1000 255 V285 H805 V590 H210 V650" class="line"/><text x="430" y="612" class="sub">controller-selected feasible design</text>
  <path d="M355 710 H430" class="line"/><path d="M700 710 H775" class="line"/>
  <path d="M1135 710 H1150 V200 H1135" class="loop"/>
  <text x="905" y="612" class="sub" fill="#0369a1">verification can reopen the same study</text>
</svg>
