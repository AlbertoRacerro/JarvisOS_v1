name: 100f Browser Evidence

on:
  push:
    branches: [evidence/100f-browser-221d50d9]

permissions:
  contents: read

jobs:
  browser-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Materialize exact product head
        run: |
          git fetch --no-tags --depth=1 origin c36c0f88219fd6d5ef42c575b19a8dfbe90875d1
          git worktree add --detach /tmp/jarvisos-product c36c0f88219fd6d5ef42c575b19a8dfbe90875d1
          mkdir -p /tmp/jarvisos-product/frontend/evidence
          cp frontend/evidence/100f-browser.mjs /tmp/jarvisos-product/frontend/evidence/100f-browser.mjs
          sed -i 's/221d50d9befcb7fafe56148e7104da9a056d36f4/c36c0f88219fd6d5ef42c575b19a8dfbe90875d1/g' /tmp/jarvisos-product/frontend/evidence/100f-browser.mjs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/jarvisos-product/frontend/evidence/100f-browser.mjs')
          text = p.read_text()
          old = 'await collapse.click();assert.equal(await collapse.getAttribute("aria-expanded"),"false");await stateShot(page,engine,s,"execution-collapsed");await page.getByRole("button",{name:"Expand",exact:true}).click();'
          new = 'await collapse.click();const expand=page.getByRole("button",{name:"Expand",exact:true});assert.equal(await expand.getAttribute("aria-expanded"),"false");await stateShot(page,engine,s,"execution-collapsed");await expand.click();'
          if old not in text:
              raise SystemExit('expected Roadmap interaction proof locator pattern not found')
          p.write_text(text.replace(old, new))
          PY
          test "$(git -C /tmp/jarvisos-product rev-parse HEAD)" = "c36c0f88219fd6d5ef42c575b19a8dfbe90875d1"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install exact frontend dependencies
        working-directory: /tmp/jarvisos-product/frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Production build
        working-directory: /tmp/jarvisos-product/frontend
        run: npm run build

      - name: Install evidence-only Playwright
        working-directory: /tmp/jarvisos-product/frontend
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium firefox

      - name: Verify evidence harness binding
        run: grep -F 'const PRODUCT_HEAD="c36c0f88219fd6d5ef42c575b19a8dfbe90875d1";' /tmp/jarvisos-product/frontend/evidence/100f-browser.mjs

      - name: Start production and canonical-reference servers
        run: |
          (cd /tmp/jarvisos-product/frontend && npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/jarvisos-100f-vite.log 2>&1) &
          (cd /tmp/jarvisos-product && python3 -m http.server 4174 --bind 127.0.0.1 > /tmp/jarvisos-100f-reference.log 2>&1) &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/design/process >/dev/null && \
               curl --fail --silent http://127.0.0.1:4174/docs/design-references/process-beta/process-beta-approved-2026-08-26.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/jarvisos-100f-vite.log || true
          cat /tmp/jarvisos-100f-reference.log || true
          exit 1

      - name: Run 11-surface paired browser matrix
        working-directory: /tmp/jarvisos-product/frontend
        run: node evidence/100f-browser.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 100f-browser-evidence-c36c0f88
          path: /tmp/jarvisos-product/frontend/evidence/100f-artifacts
          if-no-files-found: error
