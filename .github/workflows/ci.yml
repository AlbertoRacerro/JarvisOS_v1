name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  app-shell-browser-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_SHA: 8c65977cafcd7237341fedf7adbf19053713f860
      JARVISOS_DATA_ROOT: ${{ runner.temp }}/jarvisos-browser-data
      JARVISOS_AI_PROVIDER: none
      JARVISOS_ENV: browser-verification
      BASE_URL: http://127.0.0.1:8000
      DEV_URL: http://127.0.0.1:5173
      MATRIX_REPORT: ${{ runner.temp }}/app-shell-browser-matrix.json

    steps:
      - name: Checkout temporary verifier definition
        uses: actions/checkout@v4
        with:
          ref: verify-083-browser-matrix
          path: verifier
          fetch-depth: 1

      - name: Checkout exact APP-SHELL head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          path: target
          fetch-depth: 1

      - name: Verify exact target
        shell: bash
        run: |
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git -C target status --short)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: target/frontend/package-lock.json

      - name: Build locked production frontend
        working-directory: target/frontend
        run: |
          npm ci
          npm run build

      - name: Prove production DEV exclusion
        shell: bash
        run: |
          test -d target/frontend/dist
          if grep -RIlF -e '/legacy/dev-local-chat' -e 'Development Local Chat' -e 'Dev Local Chat' target/frontend/dist; then
            echo 'Development-only route or label found in production dist' >&2
            exit 1
          fi

      - name: Install Chromium verifier
        working-directory: target/frontend
        run: |
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: target/backend/requirements.txt

      - name: Install backend and initialize isolated storage
        working-directory: target/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          mkdir -p "$JARVISOS_DATA_ROOT"
          python -m app.core.bootstrap

      - name: Extract exact browser matrix script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('verifier/.github/workflows/verify-app-shell-browser.yml').read_text(encoding='utf-8')
          start = "          cat > .tmp-app-shell-browser.mjs <<'EOF'\n"
          end = "\n          EOF\n"
          if start not in source:
              raise SystemExit('browser script start marker missing')
          body = source.split(start, 1)[1]
          if end not in body:
              raise SystemExit('browser script end marker missing')
          body = body.split(end, 1)[0]
          lines = [line[10:] if line.startswith('          ') else line for line in body.splitlines()]
          target = Path('target/frontend/.tmp-app-shell-browser.mjs')
          target.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(f'extracted {len(lines)} browser-script lines')
          PY

      - name: Start production FastAPI and Vite development server
        shell: bash
        run: |
          (cd target/backend && python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/fastapi.log" 2>&1 & echo $! > "$RUNNER_TEMP/fastapi.pid")
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$BASE_URL/health" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$BASE_URL/health" > /dev/null

          (cd target/frontend && npm run dev -- --host 127.0.0.1 --port 5173 > "$RUNNER_TEMP/vite.log" 2>&1 & echo $! > "$RUNNER_TEMP/vite.pid")
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$DEV_URL/home" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$DEV_URL/home" > /dev/null

      - name: Run exact-head production browser matrix
        working-directory: target/frontend
        run: |
          node .tmp-app-shell-browser.mjs
          rm -f .tmp-app-shell-browser.mjs
          test -z "$(git status --short)"

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-shell-browser-matrix-8c65977
          path: |
            ${{ runner.temp }}/app-shell-browser-matrix.json
            ${{ runner.temp }}/fastapi.log
            ${{ runner.temp }}/vite.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop temporary servers
        if: always()
        shell: bash
        run: |
          test ! -f "$RUNNER_TEMP/vite.pid" || kill "$(cat "$RUNNER_TEMP/vite.pid")" || true
          test ! -f "$RUNNER_TEMP/fastapi.pid" || kill "$(cat "$RUNNER_TEMP/fastapi.pid")" || true
