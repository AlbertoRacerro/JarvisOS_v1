name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  hardening-bootstrap:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 210 && github.event.pull_request.head.ref == 'spec/079-minimal-continuation-definition' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spec/079-minimal-continuation-definition
          fetch-depth: 0

      - name: Materialize verified 079 hardening bundle
        run: |
          cat scripts/.079-hardening.part* | base64 -d > "$RUNNER_TEMP/079-hardening.tar.gz"
          mkdir -p "$RUNNER_TEMP/079-hardening"
          tar -xzf "$RUNNER_TEMP/079-hardening.tar.gz" -C "$RUNNER_TEMP/079-hardening"
          cp "$RUNNER_TEMP/079-hardening/daily_development_continuation.py" scripts/daily_development_continuation.py
          cp "$RUNNER_TEMP/079-hardening/test_daily_development_continuation.py" backend/tests/test_daily_development_continuation.py
          cp "$RUNNER_TEMP/079-hardening/daily-development-continuation.yml" .github/workflows/daily-development-continuation.yml
          rm scripts/.079-hardening.part*
          python -m py_compile scripts/daily_development_continuation.py backend/tests/test_daily_development_continuation.py
          python -m pytest -q backend/tests/test_daily_development_continuation.py
          git diff --check

      - name: Push hardening-only commit
        run: |
          git config user.name 'jarvisos-hardening-bootstrap[bot]'
          git config user.email 'jarvisos-hardening-bootstrap[bot]@users.noreply.github.com'
          git add scripts/daily_development_continuation.py \
            backend/tests/test_daily_development_continuation.py \
            .github/workflows/daily-development-continuation.yml \
            scripts/.079-hardening.part00 scripts/.079-hardening.part01 \
            scripts/.079-hardening.part02 scripts/.079-hardening.part03 \
            scripts/.079-hardening.part04
          git commit -m 'Harden scheduled continuation authority'
          git push origin HEAD:refs/heads/spec/079-minimal-continuation-definition

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Spec status registry gate
        run: |
          python scripts/check_spec_status.py --self-test
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            python scripts/check_spec_status.py --event "$GITHUB_EVENT_PATH"
          else
            python scripts/check_spec_status.py
          fi

      - name: Manual review tooling offline gate
        run: |
          python scripts/cheap_review.py --self-test
          python scripts/manual_review.py --self-test

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: BLUECAD license-boundary import gate
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path

          pattern = re.compile(r"^\s*(?:import\s+(?:gmsh|FreeCAD|calculix)\b|from\s+(?:gmsh|FreeCAD|calculix)\b)")
          paths = list(Path("backend/app").rglob("*.py"))
          src_root = Path("frontend/src")
          if src_root.exists():
              paths.extend(path for path in src_root.rglob("*") if path.suffix in {".ts", ".tsx"})

          violations = []
          for path in paths:
              for lineno, line in enumerate(path.read_text(encoding="utf-8").splitlines(), start=1):
                  if pattern.search(line):
                      violations.append(f"{path}:{lineno}: {line.strip()}")

          if violations:
              print("Forbidden in-process GPL tool imports found:")
              print("\n".join(violations))
              sys.exit(1)
          PY

      - name: Ruff
        working-directory: backend
        run: >-
          python -m ruff check app tests ../scripts/check_spec_status.py
          ../scripts/daily_development_continuation.py
          ../scripts/cheap_review.py ../scripts/manual_review.py

      - name: Pytest
        working-directory: backend
        run: python -m pytest -q

  bluecad-geometry-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      JARVISOS_BLUECAD_CANARY_PROFILE: ubuntu24-py311
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run canonical canary, bounded property suite, and capped-manifold kernel proof
        id: property
        working-directory: backend
        shell: bash
        env:
          JARVISOS_BLUECAD_CANARY_ACTUAL: ${{ runner.temp }}/bluecad-property-canary-actual.json
        run: |
          set -o pipefail
          set +e
          SECONDS=0
          python -m pytest -q \
            tests/bluecad/test_manifest_determinism_canary.py \
            tests/bluecad/test_geometry_property_invariants.py \
            tests/bluecad/test_capped_manifold.py \
            2>&1 | tee "$RUNNER_TEMP/bluecad-property-canary.log"
          status=${PIPESTATUS[0]}
          elapsed=$SECONDS
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "elapsed=$elapsed" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload bounded canary diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bluecad-property-canary
          path: |
            ${{ runner.temp }}/bluecad-property-canary.log
            ${{ runner.temp }}/bluecad-property-canary-actual.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce property and time gates
        if: always()
        shell: bash
        run: |
          test "${{ steps.property.outputs.status }}" = "0"
          test "${{ steps.property.outputs.elapsed }}" -le 240
