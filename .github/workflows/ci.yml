name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  materialize-079-hardening:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 210 && github.head_ref == 'spec/079-minimal-continuation-definition' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reconstruct and verify final payload
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/.079-final.part00 scripts/.079-final.part01 \
              scripts/.079-final.part02 scripts/.079-final.part03 \
              | base64 -d > "$RUNNER_TEMP/079-final-hardening.tar.gz"
          echo "a825e1fddf8573349d7a06146e262fb020e63e90b3b72bb570688e84ea0208cf  $RUNNER_TEMP/079-final-hardening.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/079-final-hardening"
          tar -xzf "$RUNNER_TEMP/079-final-hardening.tar.gz" -C "$RUNNER_TEMP/079-final-hardening"
          install -m 0755 "$RUNNER_TEMP/079-final-hardening/scripts/daily_development_continuation.py" scripts/daily_development_continuation.py
          install -m 0644 "$RUNNER_TEMP/079-final-hardening/backend/tests/test_daily_development_continuation.py" backend/tests/test_daily_development_continuation.py
          install -m 0644 "$RUNNER_TEMP/079-final-hardening/.github/workflows/daily-development-continuation.yml" .github/workflows/daily-development-continuation.yml
          echo "a5ef68e931123039c5f11e3177010388a308ae17ccfc977afe2f5f2c1c59f522  scripts/daily_development_continuation.py" | sha256sum -c -
          echo "a92ce57f73091306c4891bf92c34151aab24e5b89eb1adb3f354b7285b292048  backend/tests/test_daily_development_continuation.py" | sha256sum -c -
          echo "c29395de27ff212eafbd0a639cf95b07f4d75b88c2a98ab31796a984c7edf390  .github/workflows/daily-development-continuation.yml" | sha256sum -c -

      - name: Run focused gates
        run: |
          python -m pip install --disable-pip-version-check pytest pyyaml ruff
          python -m py_compile scripts/daily_development_continuation.py backend/tests/test_daily_development_continuation.py
          python -m pytest -q backend/tests/test_daily_development_continuation.py
          python -m ruff check scripts/daily_development_continuation.py backend/tests/test_daily_development_continuation.py
          python - <<'PY'
          from pathlib import Path
          import yaml
          yaml.safe_load(Path('.github/workflows/daily-development-continuation.yml').read_text())
          print('workflow YAML: OK')
          PY

      - name: Remove bootstrap and publish exact guarded commit
        env:
          HEAD_REF: ${{ github.head_ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git show "$BASE_SHA:.github/workflows/ci.yml" > .github/workflows/ci.yml
          rm scripts/.079-final.part00 scripts/.079-final.part01 scripts/.079-final.part02 scripts/.079-final.part03
          git fetch --no-tags origin "refs/heads/$HEAD_REF:refs/remotes/origin/$HEAD_REF"
          test "$(git rev-parse refs/remotes/origin/$HEAD_REF)" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml \
            .github/workflows/daily-development-continuation.yml \
            scripts/daily_development_continuation.py \
            backend/tests/test_daily_development_continuation.py \
            scripts/.079-final.part00 scripts/.079-final.part01 \
            scripts/.079-final.part02 scripts/.079-final.part03
          git diff --cached --check
          git commit --no-verify -m "Finalize payload-bound spec 079 continuation"
          git push origin "HEAD:refs/heads/$HEAD_REF"

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Spec status registry gate
        run: |
          python scripts/check_spec_status.py --self-test
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            python scripts/check_spec_status.py --event "$GITHUB_EVENT_PATH"
          else
            python scripts/check_spec_status.py
          fi

      - name: Manual review tooling offline gate
        run: |
          python scripts/cheap_review.py --self-test
          python scripts/manual_review.py --self-test

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: BLUECAD license-boundary import gate
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path

          pattern = re.compile(r"^\s*(?:import\s+(?:gmsh|FreeCAD|calculix)\b|from\s+(?:gmsh|FreeCAD|calculix)\b)")
          paths = list(Path("backend/app").rglob("*.py"))
          src_root = Path("frontend/src")
          if src_root.exists():
              paths.extend(path for path in src_root.rglob("*") if path.suffix in {".ts", ".tsx"})

          violations = []
          for path in paths:
              for lineno, line in enumerate(path.read_text(encoding="utf-8").splitlines(), start=1):
                  if pattern.search(line):
                      violations.append(f"{path}:{lineno}: {line.strip()}")

          if violations:
              print("Forbidden in-process GPL tool imports found:")
              print("\n".join(violations))
              sys.exit(1)
          PY

      - name: Ruff
        working-directory: backend
        run: >-
          python -m ruff check app tests ../scripts/check_spec_status.py
          ../scripts/daily_development_continuation.py
          ../scripts/cheap_review.py ../scripts/manual_review.py

      - name: Pytest
        working-directory: backend
        run: python -m pytest -q

  bluecad-geometry-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      JARVISOS_BLUECAD_CANARY_PROFILE: ubuntu24-py311
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run canonical canary, bounded property suite, and capped-manifold kernel proof
        id: property
        working-directory: backend
        shell: bash
        env:
          JARVISOS_BLUECAD_CANARY_ACTUAL: ${{ runner.temp }}/bluecad-property-canary-actual.json
        run: |
          set -o pipefail
          set +e
          SECONDS=0
          python -m pytest -q \
            tests/bluecad/test_manifest_determinism_canary.py \
            tests/bluecad/test_geometry_property_invariants.py \
            tests/bluecad/test_capped_manifold.py \
            2>&1 | tee "$RUNNER_TEMP/bluecad-property-canary.log"
          status=${PIPESTATUS[0]}
          elapsed=$SECONDS
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "elapsed=$elapsed" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload bounded canary diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bluecad-property-canary
          path: |
            ${{ runner.temp }}/bluecad-property-canary.log
            ${{ runner.temp }}/bluecad-property-canary-actual.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce property and time gates
        if: always()
        shell: bash
        run: |
          test "${{ steps.property.outputs.status }}" = "0"
          test "${{ steps.property.outputs.elapsed }}" -le 240
