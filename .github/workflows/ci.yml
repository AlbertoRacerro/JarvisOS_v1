name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      run_backend: ${{ steps.scope.outputs.run_backend }}
      run_frontend: ${{ steps.scope.outputs.run_frontend }}
      run_bluecad: ${{ steps.scope.outputs.run_bluecad }}
      full_required: ${{ steps.scope.outputs.full_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Classify CI scope
        id: scope
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/classify_ci_scope.py --self-test

          emit_full() {
            {
              echo "docs_only=false"
              echo "run_backend=true"
              echo "run_frontend=true"
              echo "run_bluecad=true"
              echo "full_required=true"
            } >> "$GITHUB_OUTPUT"
          }

          case "$GITHUB_EVENT_NAME" in
            pull_request)
              BASE_SHA="$PR_BASE_SHA"
              HEAD_SHA="$PR_HEAD_SHA"
              # Keep checkout shallow, but make both exact PR endpoints available.
              # The pull/<n>/head ref works for same-repo and fork pull requests.
              git fetch --no-tags --depth=1 origin "$BASE_SHA"
              git fetch --no-tags --depth=1 origin "refs/pull/${PR_NUMBER}/head"
              ;;
            push)
              BASE_SHA="$PUSH_BASE_SHA"
              HEAD_SHA="$PUSH_HEAD_SHA"
              # A missing/all-zero before SHA can occur on unusual ref creation or
              # rewritten history. Fail closed rather than infer a partial domain.
              if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
                emit_full
                exit 0
              fi
              git fetch --no-tags --depth=1 origin "$BASE_SHA"
              ;;
            *)
              # Scheduled/manual runs are the explicit repository-wide regression.
              emit_full
              exit 0
              ;;
          esac

          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          # Disable rename collapsing so a move across execution domains is
          # observed as delete+add and therefore cannot gain a narrower lane.
          git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"
          python3 scripts/classify_ci_scope.py < "$RUNNER_TEMP/changed-files.txt" >> "$GITHUB_OUTPUT"

  backend:
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Spec status registry gate
        run: |
          python scripts/check_spec_status.py --self-test
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            python scripts/check_spec_status.py --event "$GITHUB_EVENT_PATH"
          else
            python scripts/check_spec_status.py
          fi

      - name: Manual review tooling offline gate
        run: |
          python scripts/cheap_review.py --self-test
          python scripts/manual_review.py --self-test
          python scripts/check_review_secret_boundary.py --self-test

      - name: PR attention anti-authority gate
        run: |
          python scripts/check_pr_attention_integration.py --self-test
          python scripts/check_pr_attention_integration.py

      - name: BLUECAD license-boundary import gate
        if: needs.classify.outputs.run_backend == 'true' || needs.classify.outputs.run_frontend == 'true'
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path

          pattern = re.compile(r"^\s*(?:import\s+(?:gmsh|FreeCAD|calculix)\b|from\s+(?:gmsh|FreeCAD|calculix)\b)")
          paths = []
          if "${{ needs.classify.outputs.run_backend }}" == "true":
              paths.extend(Path("backend/app").rglob("*.py"))
          if "${{ needs.classify.outputs.run_frontend }}" == "true":
              src_root = Path("frontend/src")
              if src_root.exists():
                  paths.extend(path for path in src_root.rglob("*") if path.suffix in {".ts", ".tsx"})

          violations = []
          for path in paths:
              for lineno, line in enumerate(path.read_text(encoding="utf-8").splitlines(), start=1):
                  if pattern.search(line):
                      violations.append(f"{path}:{lineno}: {line.strip()}")

          if violations:
              print("Forbidden in-process GPL tool imports found:")
              print("\n".join(violations))
              sys.exit(1)
          PY

      - name: Docs-only fast path
        if: needs.classify.outputs.docs_only == 'true'
        run: |
          echo "docs/**-only change: governance gates passed; unrelated runtime domains are intentionally skipped."

      - name: Install backend dependencies
        if: needs.classify.outputs.run_backend == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Architecture enforcement gate
        if: needs.classify.outputs.run_backend == 'true'
        run: |
          python scripts/check_architecture_enforcement.py --self-test
          python scripts/check_architecture_enforcement.py

      - name: Ruff
        if: needs.classify.outputs.run_backend == 'true'
        working-directory: backend
        run: >-
          python -m ruff check app tests ../scripts/check_spec_status.py
          ../scripts/cheap_review.py ../scripts/manual_review.py
          ../scripts/check_review_secret_boundary.py
          ../scripts/check_architecture_enforcement.py
          ../scripts/check_pr_attention_integration.py
          ../scripts/classify_ci_scope.py

  backend-core-tests:
    name: backend-tests (${{ matrix.group }})
    needs: classify
    if: needs.classify.outputs.run_backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        group: [core-a, core-b]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run backend core test shard
        working-directory: backend
        shell: bash
        env:
          TEST_GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          if [ "$TEST_GROUP" = "core-a" ]; then
            export CORE_SHARD=0
          else
            export CORE_SHARD=1
          fi

          mapfile -t test_files < <(python - <<'PY'
          import os
          from pathlib import Path

          shard = int(os.environ["CORE_SHARD"])
          bluecad_root = Path("tests/bluecad")
          files = sorted(
              path
              for path in Path("tests").rglob("test_*.py")
              if path.is_file() and not path.is_relative_to(bluecad_root)
          )
          assigned = [files[0::2], files[1::2]]
          assert files
          assert sorted(assigned[0] + assigned[1]) == files
          assert set(assigned[0]).isdisjoint(assigned[1])
          for path in assigned[shard]:
              print(path)
          PY
          )
          test "${#test_files[@]}" -gt 0
          python -m pytest -q "${test_files[@]}"

  backend-bluecad-tests:
    name: backend-tests (${{ matrix.group }})
    needs: classify
    if: needs.classify.outputs.run_bluecad == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        group: [bluecad-a, bluecad-b]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run BLUECAD test shard
        working-directory: backend
        shell: bash
        env:
          TEST_GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          if [ "$TEST_GROUP" = "bluecad-a" ]; then
            export BLUECAD_SHARD=0
          else
            export BLUECAD_SHARD=1
          fi

          mapfile -t test_files < <(python - <<'PY'
          import os
          from pathlib import Path

          shard = int(os.environ["BLUECAD_SHARD"])
          canary_owned = {
              Path("tests/bluecad/test_manifest_determinism_canary.py"),
              Path("tests/bluecad/test_geometry_property_invariants.py"),
              Path("tests/bluecad/test_capped_manifold.py"),
          }
          files = sorted(
              path
              for path in Path("tests/bluecad").rglob("test_*.py")
              if path not in canary_owned
          )
          assigned = [files[0::2], files[1::2]]
          assert files
          assert sorted(assigned[0] + assigned[1]) == files
          assert set(assigned[0]).isdisjoint(assigned[1])
          for path in assigned[shard]:
              print(path)
          PY
          )
          test "${#test_files[@]}" -gt 0
          python -m pytest -q "${test_files[@]}"

  frontend-build:
    needs: classify
    if: needs.classify.outputs.run_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  bluecad-geometry-canary:
    needs: classify
    if: needs.classify.outputs.run_bluecad == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      JARVISOS_BLUECAD_CANARY_PROFILE: ubuntu24-py311
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run canonical canary, bounded property suite, and capped-manifold kernel proof
        id: property
        working-directory: backend
        shell: bash
        env:
          JARVISOS_BLUECAD_CANARY_ACTUAL: ${{ runner.temp }}/bluecad-property-canary-actual.json
        run: |
          set -o pipefail
          set +e
          SECONDS=0
          python -m pytest -q \
            tests/bluecad/test_manifest_determinism_canary.py \
            tests/bluecad/test_geometry_property_invariants.py \
            tests/bluecad/test_capped_manifold.py \
            2>&1 | tee "$RUNNER_TEMP/bluecad-property-canary.log"
          status=${PIPESTATUS[0]}
          elapsed=$SECONDS
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "elapsed=$elapsed" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload bounded canary diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bluecad-property-canary
          path: |
            ${{ runner.temp }}/bluecad-property-canary.log
            ${{ runner.temp }}/bluecad-property-canary-actual.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce property and time gates
        if: always()
        shell: bash
        run: |
          test "${{ steps.property.outputs.status }}" = "0"
          test "${{ steps.property.outputs.elapsed }}" -le 240
