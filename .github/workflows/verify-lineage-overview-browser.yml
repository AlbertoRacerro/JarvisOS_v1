name: LINEAGE Overview Browser Proof

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  verify-lineage-overview:
    if: github.head_ref == 'verify-087-browser-2fd0330' || github.ref == 'refs/heads/verify-087-browser-2fd0330'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_LINEAGE_BROWSER_PROOF: "true"
      TARGET_IMPLEMENTATION_SHA: "8da4462f8e1794d91ebbd23aa2e1891596857522"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install browser-proof dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Correct proof fixture locators
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("backend/tests/test_lineage_overview_browser_verification.py")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  'await page.getByText("provenance", { exact: true }).first().waitFor();\nawait page.getByText(/Historical status remains accepted/).waitFor();',
                  'await page.getByText("provenance", { exact: true }).first().waitFor();\nawait page.getByRole("button", { name: "Show context", exact: true }).click();\nawait page.getByText(/Historical status remains accepted/).waitFor();',
              ),
              (
                  'await page.getByText("Workspace B parameter", { exact: true }).waitFor({ timeout: 10000 });',
                  'await page.getByRole("button", { name: "Workspace B parameter", exact: true }).waitFor({ timeout: 10000 });',
              ),
              (
                  'workspaceMode = "empty";\nawait page.reload({ waitUntil: "domcontentloaded" });\nawait page.getByText("No workspaces are available.", { exact: true }).first().waitFor();\nworkspaceMode = "error";\nawait page.reload({ waitUntil: "domcontentloaded" });\nawait page.getByText(/Workspace discovery failed/).first().waitFor();',
                  'workspaceMode = "empty";\nawait page.reload({ waitUntil: "domcontentloaded" });\nawait openNavigator();\nawait page.getByText("No workspaces are available.", { exact: true }).first().waitFor();\nworkspaceMode = "error";\nawait page.reload({ waitUntil: "domcontentloaded" });\nawait openNavigator();\nawait page.getByText(/Workspace discovery failed/).first().waitFor();',
              ),
              (
                  'graphMode = "normal"; freshnessMode = "error";\nawait page.reload({ waitUntil: "domcontentloaded" });\nawait page.getByText(/Freshness is unavailable for this node/).waitFor();\nfreshnessMode = "normal"; nodeMode = "404";\nawait page.reload({ waitUntil: "domcontentloaded" });\nawait page.getByText(/no longer resolvable/).waitFor();',
                  'graphMode = "normal"; freshnessMode = "error";\nawait page.reload({ waitUntil: "domcontentloaded" });\nawait page.getByText("Long parameter A", { exact: true }).first().waitFor({ timeout: 10000 });\nawait page.getByRole("button", { name: "Show context", exact: true }).click();\nawait page.getByText("Freshness", { exact: true }).locator("..").getByText("Unavailable", { exact: true }).waitFor();\nfreshnessMode = "normal"; nodeMode = "404";\nawait page.reload({ waitUntil: "domcontentloaded" });\nawait page.getByText("Long parameter A", { exact: true }).first().waitFor({ timeout: 10000 });\nawait page.getByRole("button", { name: "Show context", exact: true }).click();\nawait page.getByText(/no longer resolvable/).waitFor();',
              ),
              (
                  'for (const [url, heading] of [["/design/model", "Model workbench"], ["/design/results", "Results"], ["/design/review", "Review"]]) {',
                  'for (const [url, heading] of [["/design/model", "Model workbench"], ["/design/results", "Results"], ["/review", "Review"]]) {',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"expected proof fixture anchor missing: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Run exact-head lineage browser proof
        run: |
          RUN_LINEAGE_BROWSER_PROOF=true TARGET_IMPLEMENTATION_SHA="$TARGET_IMPLEMENTATION_SHA" python -m pytest -q backend/tests/test_lineage_overview_browser_verification.py -s
