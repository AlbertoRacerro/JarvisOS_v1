name: LINEAGE Overview Browser Proof

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  verify-lineage-overview:
    if: github.head_ref == 'verify-087-browser-2fd0330' || github.ref == 'refs/heads/verify-087-browser-2fd0330'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_LINEAGE_BROWSER_PROOF: "true"
      TARGET_IMPLEMENTATION_SHA: "8da4462f8e1794d91ebbd23aa2e1891596857522"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install browser-proof dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Correct compact-panel proof fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("backend/tests/test_lineage_overview_browser_verification.py")
          text = path.read_text(encoding="utf-8")
          old = 'await page.getByText("provenance", { exact: true }).first().waitFor();\nawait page.getByText(/Historical status remains accepted/).waitFor();'
          new = 'await page.getByText("provenance", { exact: true }).first().waitFor();\nawait page.getByRole("button", { name: "Show context", exact: true }).click();\nawait page.getByText(/Historical status remains accepted/).waitFor();'
          if old not in text:
              raise SystemExit("expected proof fixture anchor missing")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Run exact-head lineage browser proof
        run: |
          RUN_LINEAGE_BROWSER_PROOF=true TARGET_IMPLEMENTATION_SHA="$TARGET_IMPLEMENTATION_SHA" python -m pytest -q backend/tests/test_lineage_overview_browser_verification.py -s
