name: Process Kernel Diagnostics Temporary

on:
  pull_request:

permissions:
  contents: write

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Remove exact unused import
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/app/modules/process_kernel/flowsheet.py")
          text = path.read_text(encoding="utf-8")
          old = "from .contracts import BlockResult, MaterialPort, UnitOperation\n"
          new = "from .contracts import BlockResult, UnitOperation\n"
          count = text.count(old)
          if count not in {0, 1}:
              raise SystemExit(f"unexpected replacement count: {count}")
          if count == 1:
              path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          if ! git diff --quiet -- backend/app/modules/process_kernel/flowsheet.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/app/modules/process_kernel/flowsheet.py
            git commit -m "Remove unused material port import"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Capture Ruff and focused pytest
        working-directory: backend
        shell: bash
        run: |
          set +e
          python -m ruff check app tests > "$RUNNER_TEMP/ruff.txt" 2>&1
          echo "$?" > "$RUNNER_TEMP/ruff-status.txt"
          python -m pytest -q -x \
            tests/test_process_kernel_075*.py \
            tests/test_flowsheet_shared_topology.py \
            tests/test_bluerev_geometry_hydraulics_v0.py \
            tests/test_bluerev_geometry_hydraulics_v0_laminar.py \
            > "$RUNNER_TEMP/pytest.txt" 2>&1
          echo "$?" > "$RUNNER_TEMP/pytest-status.txt"
          exit 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: process-kernel-diagnostics-temp
          path: |
            ${{ runner.temp }}/ruff.txt
            ${{ runner.temp }}/ruff-status.txt
            ${{ runner.temp }}/pytest.txt
            ${{ runner.temp }}/pytest-status.txt
          if-no-files-found: error
          retention-days: 1
