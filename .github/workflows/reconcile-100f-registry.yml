name: Reconcile 100f registry

on:
  push:
    branches: [reconcile/100f-merged-after-implementation]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: reconcile/100f-merged-after-implementation
      - name: Reconcile STATUS and remove helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/specs/STATUS.md')
          s = p.read_text(encoding='utf-8')
          replacements = [
            (
              "item 28 is now the sole `in_review` runtime front through implementation PR #390 under the merged 100f full specification/readiness and the eleven-reference preservation packet; items 29–41 remain `planned` until their own normal lifecycle authorizes them.",
              "item 28 is `merged` through implementation PR #390 under the merged 100f full specification/readiness and the eleven-reference preservation packet; items 29–41 remain `planned` until their own normal lifecycle authorizes them and are held pending explicit maintainer release after frontend inspection."
            ),
            (
              "1. 100f FINAL-OPERATOR-FRONTEND-FUSION-1 is the sole `in_review` front through implementation PR #390 after PR #388 merged the final operator-product preservation packet. Implement all eleven canonical HTML targets in the production React/Vite shell under `100f-final-operator-frontend-fusion-1.md` and `100f-readiness-2026-08-27.md`, then stop for maintainer inspection after merge and registry reconciliation.",
              "1. 100f FINAL-OPERATOR-FRONTEND-FUSION-1 is `merged` through implementation PR #390 after PR #388 merged the final operator-product preservation packet. The eleven canonical HTML targets are fused in the production React/Vite shell under `100f-final-operator-frontend-fusion-1.md` and `100f-readiness-2026-08-27.md`; the mandatory maintainer-inspection hold is now active and no 100a/100b/100c/backend work is authorized until explicit release."
            ),
            (
              "3. Preserve merged 059a/059b, 061a/061b, 075, 076, 077, 079, 082, 094, 070, 083, 084, 085, 086, 087, 088, 035, 089, 054, 090, 091, 029, 096, 071b, 092, 058c, 097, 098, 006b, 058b, 058d, and 100 authority boundaries; definition-only 095 remains non-implementation authority.",
              "3. Preserve merged 059a/059b, 061a/061b, 075, 076, 077, 079, 082, 094, 070, 083, 084, 085, 086, 087, 088, 035, 089, 054, 090, 091, 029, 096, 071b, 092, 058c, 097, 098, 006b, 058b, 058d, 100, and 100f authority boundaries; definition-only 095 remains non-implementation authority."
            ),
            (
              "6. Keep 100a, 100b, 100c and 101–110 `planned` while 100f is active; do not begin them until the maintainer releases the explicit post-100f inspection hold.",
              "6. Keep 100a, 100b, 100c and 101–110 `planned` during the active post-100f maintainer-inspection hold; do not begin them until the maintainer explicitly releases that hold."
            ),
            (
              "| 100f | in_review | [#390](https://github.com/AlbertoRacerro/JarvisOS_v1/pull/390) | FINAL-OPERATOR-FRONTEND-FUSION-1 | 058d, 100 | PR #388 merged the final eleven-reference preservation packet. Full spec `100f-final-operator-frontend-fusion-1.md` and readiness `100f-readiness-2026-08-27.md` authorize one frontend-only production fusion of all eleven canonical operator surfaces using existing truthful backend authority, with missing future actions rendered unavailable and a mandatory maintainer inspection hold after merge/reconciliation. Implementation PR #390 is the active bounded fusion. |",
              "| 100f | merged | [#390](https://github.com/AlbertoRacerro/JarvisOS_v1/pull/390) | FINAL-OPERATOR-FRONTEND-FUSION-1 | 058d, 100 | PR #388 merged the final eleven-reference preservation packet; full spec `100f-final-operator-frontend-fusion-1.md`, readiness `100f-readiness-2026-08-27.md`, and implementation PR #390 are merged. The frontend-only production fusion preserves all eleven canonical operator surfaces over existing truthful backend authority, keeps missing future actions explicitly unavailable, and activates the mandatory maintainer-inspection hold before 100a/100b/100c or backend work. |"
            ),
          ]
          for old, new in replacements:
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'expected exactly one match, found {n}: {old[:100]}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
          git rm .github/workflows/reconcile-100f-registry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/specs/STATUS.md
          git commit -m "Reconcile FINAL-OPERATOR-FRONTEND-FUSION-1 after merge"
          git push origin HEAD:reconcile/100f-merged-after-implementation
