name: Temporary reconcile 111 status

on:
  push:
    branches:
      - docs/reconcile-111-merged
    paths:
      - .github/workflows/reconcile-111-status.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: docs/reconcile-111-merged
          fetch-depth: 0
      - name: Reconcile canonical registry and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/specs/STATUS.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '43. 124 PROVIDER-SETTINGS-GENERIC-1;\n44. 121 JARVIS-PROJECT-KNOWLEDGE-ACTIONS-1;\n45. 122 JARVIS-DEVELOPMENT-ACTIONS-1;\n46. 123 JARVIS-CODING-ACTIONS-1;':
              '43. 123 JARVIS-CODING-ACTIONS-1;\n44. 124 PROVIDER-SETTINGS-GENERIC-1;\n45. 121 JARVIS-PROJECT-KNOWLEDGE-ACTIONS-1;\n46. 122 JARVIS-DEVELOPMENT-ACTIONS-1;',
              'Every newly allocated 111–126 row remains `planned` until its own definition/full-spec/readiness lifecycle authorizes implementation.':
              '111 is now merged through implementation PR #425. Every remaining 112–126 row remains `planned` until its own definition/full-spec/readiness lifecycle authorizes implementation.',
              '2. 111 JARVIS-CONTEXT-ACTION-FOUNDATION-1 is the current binding front. Its kernel/full spec/readiness are merged through PRs #418, #419, and #422, and implementation PR #425 is `in_review` under those exact accepted contracts. Jarvis must remain an adapter over the current AI execution/policy spine, with explicit exact context refs and no second orchestration store.\n3. After 111, execute Project Knowledge 112–115, Development 116–117, Coding truth 118–120 plus provider/settings 124, then Jarvis domain adapters 121–123, guarded self-update 125 and security-gated terminal 126. Each row remains independently gated and one implementation front at a time.':
              '2. 111 JARVIS-CONTEXT-ACTION-FOUNDATION-1 is merged through implementation PR #425 under the accepted #418/#419/#422 contracts. 112 PROJECT-KNOWLEDGE-CORE-1 is the next binding front and remains `planned` pending its own definition/full-spec/readiness lifecycle.\n3. After 112 merges, controlled parallel delivery may activate under `docs/POST_112_PARALLEL_DELIVERY_PROFILE.md`: Project Knowledge continues through 113–115, Development through 116–117, and the accelerated Coding foundation is 118 → 119 → 120 → 123, followed by a fresh Hermes V1 re-derivation/release gate before the remaining 124/121/122/125/126 slices as their dependencies and readiness permit. Until 112 merges, execution remains serial.',
              'Preserve merged 059a/059b, 061a/061b, 075, 076, 077, 079, 082, 094, 070, 083, 084, 085, 086, 087, 088, 035, 089, 054, 090, 091, 029, 096, 071b, 092, 058c, 097, 098, 006b, 058b, 058d, 100, 100f, 100g, and 100b authority boundaries;':
              'Preserve merged 059a/059b, 061a/061b, 075, 076, 077, 079, 082, 094, 070, 083, 084, 085, 086, 087, 088, 035, 089, 054, 090, 091, 029, 096, 071b, 092, 058c, 097, 098, 006b, 058b, 058d, 100, 100f, 100g, 100b, and 111 authority boundaries;',
              '| 100c | planned | — | FINAL-PRODUCT-DIRECTION-AUTHORITY-0 | 100b | Definition/queue re-derivation merged through PR #416. Exact-master overlap audit, capability/interaction ownership map and canonical queue are binding planning authority; 100c has no runtime implementation PR and planned 111 is next. |':
              '| 100c | planned | — | FINAL-PRODUCT-DIRECTION-AUTHORITY-0 | 100b | Definition/queue re-derivation merged through PR #416. Exact-master overlap audit, capability/interaction ownership map and canonical queue are binding planning authority; 100c has no runtime implementation PR. 111 has since merged and planned 112 is next. |',
              '| 111 | in_review | [#425](https://github.com/AlbertoRacerro/JarvisOS_v1/pull/425) | JARVIS-CONTEXT-ACTION-FOUNDATION-1 | 040, 042, 059b, 061a, 061b, 090, 091, 097 |':
              '| 111 | merged | [#425](https://github.com/AlbertoRacerro/JarvisOS_v1/pull/425) | JARVIS-CONTEXT-ACTION-FOUNDATION-1 | 040, 042, 059b, 061a, 061b, 090, 091, 097 |',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence, got {count}: {old[:120]!r}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/reconcile-111-status.yml
          git config user.name "JarvisOS automation"
          git config user.email "actions@users.noreply.github.com"
          git add docs/specs/STATUS.md
          git diff --cached --check
          git commit -m "Reconcile 111 merge and accelerated coding order"
          git push origin HEAD:docs/reconcile-111-merged
