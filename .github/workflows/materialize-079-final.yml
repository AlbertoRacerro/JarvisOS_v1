name: Materialize 079 Final

on:
  pull_request:

concurrency:
  group: materialize-079-final
  cancel-in-progress: true

jobs:
  materialize:
    if: ${{ github.event.pull_request.number == 210 && github.head_ref == 'spec/079-minimal-continuation-definition' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reconstruct exact payload
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/.079-final.part00 scripts/.079-final.part01 \
              scripts/.079-final.part02 scripts/.079-final.part03 \
              | base64 -d > "$RUNNER_TEMP/079-final-hardening.tar.gz"
          echo "a825e1fddf8573349d7a06146e262fb020e63e90b3b72bb570688e84ea0208cf  $RUNNER_TEMP/079-final-hardening.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/payload"
          tar -xzf "$RUNNER_TEMP/079-final-hardening.tar.gz" -C "$RUNNER_TEMP/payload"
          install -m 0755 "$RUNNER_TEMP/payload/scripts/daily_development_continuation.py" scripts/daily_development_continuation.py
          install -m 0644 "$RUNNER_TEMP/payload/backend/tests/test_daily_development_continuation.py" backend/tests/test_daily_development_continuation.py
          install -m 0644 "$RUNNER_TEMP/payload/.github/workflows/daily-development-continuation.yml" .github/workflows/daily-development-continuation.yml
          echo "a5ef68e931123039c5f11e3177010388a308ae17ccfc977afe2f5f2c1c59f522  scripts/daily_development_continuation.py" | sha256sum -c -
          echo "a92ce57f73091306c4891bf92c34151aab24e5b89eb1adb3f354b7285b292048  backend/tests/test_daily_development_continuation.py" | sha256sum -c -
          echo "c29395de27ff212eafbd0a639cf95b07f4d75b88c2a98ab31796a984c7edf390  .github/workflows/daily-development-continuation.yml" | sha256sum -c -

      - name: Run isolated focused gates
        run: |
          python -m pip install --disable-pip-version-check pytest pyyaml
          python -m py_compile scripts/daily_development_continuation.py backend/tests/test_daily_development_continuation.py
          python -m pytest -q --noconftest backend/tests/test_daily_development_continuation.py
          python - <<'PY'
          from pathlib import Path
          import yaml
          yaml.safe_load(Path('.github/workflows/daily-development-continuation.yml').read_text())
          print('workflow YAML: OK')
          PY

      - name: Restore canonical CI and push guarded result
        env:
          HEAD_REF: ${{ github.head_ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git show "$BASE_SHA:.github/workflows/ci.yml" > .github/workflows/ci.yml
          rm .github/workflows/materialize-079-final.yml
          rm scripts/.079-final.part00 scripts/.079-final.part01 scripts/.079-final.part02 scripts/.079-final.part03
          git fetch --no-tags origin "refs/heads/$HEAD_REF:refs/remotes/origin/$HEAD_REF"
          test "$(git rev-parse refs/remotes/origin/$HEAD_REF)" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit --no-verify -m "Finalize payload-bound spec 079 continuation"
          git push origin "HEAD:refs/heads/$HEAD_REF"
