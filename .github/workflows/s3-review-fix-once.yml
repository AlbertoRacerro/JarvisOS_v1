name: S3 model level object builder

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  build:
    if: github.base_ref == 'spec/077-evidence-egress-0-impl'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact S3 branch
        uses: actions/checkout@v4
        with:
          ref: spec/077-evidence-egress-0-impl
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply bounded model-level propagation fix
        run: |
          set -euo pipefail
          python scripts/s3_build_model_level_fix.py
          python -m compileall -q \
            backend/app/modules/ai/egress_authority.py \
            backend/app/modules/bluecad/evidence_egress.py \
            backend/tests/bluecad/test_evidence_egress_final_authority.py
          git diff --check

      - name: Install focused dependencies
        run: python -m pip install -r backend/requirements.txt ruff pytest

      - name: Run focused gates
        run: |
          python -m ruff check \
            backend/app/modules/ai/egress_authority.py \
            backend/app/modules/ai/egress_runtime.py \
            backend/app/modules/ai/egress_sanitizer.py \
            backend/app/modules/bluecad/evidence_egress.py \
            backend/tests/bluecad/test_evidence_egress.py \
            backend/tests/bluecad/test_evidence_egress_final_authority.py
          python -m pytest -q \
            backend/tests/bluecad/test_evidence_egress.py \
            backend/tests/bluecad/test_evidence_egress_final_authority.py

      - name: Create verified Git objects without updating refs
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_COMMIT: 7340b0f87511be488e8799e88353891f02a561a7
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import base64, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          base_commit = os.environ["BASE_COMMIT"]
          parent = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          base_tree = subprocess.check_output(
              ["git", "rev-parse", f"{base_commit}^{{tree}}"], text=True
          ).strip()
          paths = (
              "backend/app/modules/ai/egress_authority.py",
              "backend/app/modules/bluecad/evidence_egress.py",
              "backend/tests/bluecad/test_evidence_egress_final_authority.py",
          )

          def api(path: str, payload: dict[str, object]) -> dict[str, object]:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}{path}",
                  data=json.dumps(payload, separators=(",", ":")).encode(),
                  method="POST",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          blobs, entries = {}, []
          for path in paths:
              content = Path(path).read_bytes()
              blob = api("/git/blobs", {
                  "content": base64.b64encode(content).decode(),
                  "encoding": "base64",
              })
              sha = str(blob["sha"])
              blobs[path] = {"blob_sha": sha, "sha256": hashlib.sha256(content).hexdigest()}
              entries.append({"path": path, "mode": "100644", "type": "blob", "sha": sha})
          tree = api("/git/trees", {"base_tree": base_tree, "tree": entries})
          commit = api("/git/commits", {
              "message": "Bind model evidence levels into approval transaction",
              "tree": str(tree["sha"]),
              "parents": [parent],
          })
          manifest = {
              "schema_version": "s3_model_level_object_manifest_v1",
              "base_commit": base_commit,
              "base_tree": base_tree,
              "expected_parent": parent,
              "blobs": blobs,
              "tree_sha": str(tree["sha"]),
              "commit_sha": str(commit["sha"]),
              "focused_gates": {
                  "ruff": "success",
                  "pytest_files": [
                      "backend/tests/bluecad/test_evidence_egress.py",
                      "backend/tests/bluecad/test_evidence_egress_final_authority.py",
                  ],
              },
          }
          Path("s3-model-level-object-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: s3-model-level-object-manifest-${{ github.run_id }}
          path: s3-model-level-object-manifest.json
          if-no-files-found: error
          retention-days: 3
