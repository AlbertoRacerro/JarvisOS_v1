name: S3 review fix once

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.base_ref == 'spec/077-evidence-egress-0-impl'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact S3 branch
        uses: actions/checkout@v4
        with:
          ref: spec/077-evidence-egress-0-impl
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply exact review patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/s3_fix_review_p1.py")
          text = path.read_text(encoding="utf-8")
          old = """    TEST,
              '''        \"ordered_source_refs\": [\"evidence:e1\"],
                  \"sight_digest\": \"sha256:\" + \"1\" * 64,
          ''',
              '''        \"ordered_source_refs\": [\"evidence:e1\"],
                  \"source_effective_levels\": [\"S1\"],
                  \"sight_digest\": \"sha256:\" + \"1\" * 64,
          ''',"""
          new = """    TEST,
              '''        \"source_attempt_id\": \"attempt-1\",
                  \"ordered_source_refs\": [\"evidence:e1\"],
                  \"sight_digest\": \"sha256:\" + \"1\" * 64,
          ''',
              '''        \"source_attempt_id\": \"attempt-1\",
                  \"ordered_source_refs\": [\"evidence:e1\"],
                  \"source_effective_levels\": [\"S1\"],
                  \"sight_digest\": \"sha256:\" + \"1\" * 64,
          ''',"""
          if text.count(old) != 1:
              raise RuntimeError("expected one script fixture replacement")
          text = text.replace(old, new, 1)
          escaped = r"Generic repair\n"
          if text.count(escaped) != 3:
              raise RuntimeError(
                  f"expected three literal-newline escapes, found {text.count(escaped)}"
              )
          text = text.replace(escaped, r"Generic repair\\n")
          path.write_text(text, encoding="utf-8")
          PY
          python scripts/s3_fix_review_p1.py
          python -m compileall -q \
            backend/app/modules/bluecad/evidence_egress.py \
            backend/tests/bluecad/test_evidence_egress.py
          git diff --check

      - name: Install focused test dependencies
        run: python -m pip install -r backend/requirements.txt ruff pytest

      - name: Run focused review gates
        run: |
          python -m ruff check \
            backend/app/modules/bluecad/evidence_egress.py \
            backend/tests/bluecad/test_evidence_egress.py
          python -m pytest -q backend/tests/bluecad/test_evidence_egress.py

      - name: Publish clean S3 fix
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/s3_fix_review_p1.py
          rm .github/workflows/s3-review-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Close final S3 evidence authority review findings"
          git push origin HEAD:spec/077-evidence-egress-0-impl
