name: TEMP Codex Authority Bootstrap

on:
  push:
    branches: [fix/codex-result-authority-v2]
    paths: [.github/workflows/codex-authority-bootstrap.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/codex-result-authority-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply maintainer-authorized exact architecture amendment
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one replacement in {path}, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          scanner = Path("scripts/check_architecture_enforcement.py")
          replace_once(
              scanner,
              "def _scan_workflow(path: Path, root: Path) -> list[Finding]:",
              "def _scan_workflow(\n    path: Path, root: Path, exceptions: set[tuple[str, str]]\n) -> list[Finding]:",
          )
          replace_once(
              scanner,
              '    if issue_comment:\n        return [Finding("AE004", rel, "on.issue_comment", "automatic issue_comment workflow is forbidden by 128")]\n',
              '    exact_issue_comment = f"{rel}::on.issue_comment"\n    if issue_comment and ("AE004", exact_issue_comment) not in exceptions:\n        return [Finding("AE004", rel, "on.issue_comment", "automatic issue_comment workflow is forbidden by 128")]\n',
          )
          replace_once(
              scanner,
              '_scan_python(path, root, exceptions) if path.suffix == ".py" else _scan_workflow(path, root)',
              '_scan_python(path, root, exceptions) if path.suffix == ".py" else _scan_workflow(path, root, exceptions)',
          )

          config_path = Path("configs/architecture_enforcement.json")
          config_text = config_path.read_text(encoding="utf-8")
          exact = ".github/workflows/codex-result-delivery.yml::on.issue_comment"
          if exact not in config_text:
              entry = {
                  "rule_id": "AE004",
                  "exact_match": exact,
                  "classification": "accepted_owner",
                  "owner_or_removal_spec": "022/128 codex-result authority 2026-09-13",
                  "rationale": "single exact Codex-result dispatcher into the existing trusted cloud-delivery bridge",
              }
              lines = config_text.splitlines()
              try:
                  close = max(i for i, line in enumerate(lines) if line == "  ]")
              except ValueError as exc:
                  raise SystemExit("architecture config closing list not found") from exc
              previous = close - 1
              while previous >= 0 and not lines[previous].strip():
                  previous -= 1
              if previous < 0 or not lines[previous].lstrip().startswith("{"):
                  raise SystemExit("architecture config final exception not found")
              if not lines[previous].rstrip().endswith(","):
                  lines[previous] = lines[previous] + ","
              encoded = json.dumps(entry, separators=(",", ":"), ensure_ascii=False)
              lines.insert(close, "    " + encoded)
              config_path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          amendments = {
              Path("docs/specs/022-codex-pr-autopush.md"): (
                  "## 2026-09-13 bounded Codex result authority amendment",
                  "\n\n## 2026-09-13 bounded Codex result authority amendment\n\n"
                  "The maintainer explicitly authorized the deferred automatic materialization gap in this spec. "
                  "The exact authority contract is `docs/specs/022-128-codex-result-authority-2026-09-13.md`. "
                  "Codex may now cause a result payload to be considered automatically only through the exact "
                  "`codex-result-delivery.yml` issue-comment dispatcher defined there; the dispatcher itself has no "
                  "contents-write or merge authority and delegates all patch admission, validation, exact-head CAS and "
                  "guarded branch mutation to the existing trusted cloud-delivery bridge. A task-local commit remains "
                  "non-materialized evidence until the remote PR branch advances.\n"
              ),
              Path("docs/specs/128-architecture-enforcement-gate-1.md"): (
                  "## 2026-09-13 exact AE004 amendment",
                  "\n\n## 2026-09-13 exact AE004 amendment\n\n"
                  "The maintainer explicitly authorized one narrow accepted AE004 owner after the original 128 freeze: "
                  "`.github/workflows/codex-result-delivery.yml::on.issue_comment`, governed by "
                  "`docs/specs/022-128-codex-result-authority-2026-09-13.md`. The architecture scanner may admit only "
                  "that exact path+trigger through the reviewed exception configuration. This does not relax the "
                  "Coordination Bus V2 negative-authority rule: `JARVIS_COORD_V2`, `WORKPACK`, or `CANDIDATE_PATCH` "
                  "reaching repository mutation remains AE004 even inside the admitted workflow, and every other "
                  "automatic `issue_comment` workflow remains forbidden absent a future explicit amendment.\n"
              ),
          }
          for path, (marker, addition) in amendments.items():
              text = path.read_text(encoding="utf-8")
              if marker not in text:
                  path.write_text(text.rstrip() + addition + "\n", encoding="utf-8")
          PY

      - name: Remove one-shot bootstrap and commit exact patch
        run: |
          set -euo pipefail
          git config user.name "JarvisOS Maintainer Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/codex-authority-bootstrap.yml
          git add scripts/check_architecture_enforcement.py configs/architecture_enforcement.json \
            docs/specs/022-codex-pr-autopush.md docs/specs/128-architecture-enforcement-gate-1.md
          git diff --cached --check
          git commit -m "fix: authorize exact Codex result delivery path"
          git push origin HEAD:fix/codex-result-authority-v2
