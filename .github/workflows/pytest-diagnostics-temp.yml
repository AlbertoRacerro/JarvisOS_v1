name: Pytest Diagnostics Temporary

on:
  pull_request:

jobs:
  pytest-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Capture first pytest failure
        working-directory: backend
        shell: bash
        run: |
          set +e
          python -m pytest -q -x > "$RUNNER_TEMP/pytest-output.txt" 2>&1
          status=$?
          echo "$status" > "$RUNNER_TEMP/pytest-status.txt"
          exit 0
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics-temp
          path: |
            ${{ runner.temp }}/pytest-output.txt
            ${{ runner.temp }}/pytest-status.txt
          if-no-files-found: error
          retention-days: 1
