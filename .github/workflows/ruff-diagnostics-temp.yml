name: Ruff Diagnostics Temporary

on:
  pull_request:

jobs:
  ruff-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Capture Ruff diagnostics
        working-directory: backend
        shell: bash
        run: |
          set +e
          python -m ruff check app tests ../scripts/check_spec_status.py \
            ../scripts/cheap_review.py ../scripts/manual_review.py \
            --output-format=json > "$RUNNER_TEMP/ruff-diagnostics.json"
          status=$?
          echo "$status" > "$RUNNER_TEMP/ruff-status.txt"
          exit 0
      - name: Upload Ruff diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-diagnostics-temp
          path: |
            ${{ runner.temp }}/ruff-diagnostics.json
            ${{ runner.temp }}/ruff-status.txt
          if-no-files-found: error
          retention-days: 1
