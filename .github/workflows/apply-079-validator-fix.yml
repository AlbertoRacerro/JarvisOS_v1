name: Apply 079 Validator Fix

on:
  pull_request:

concurrency:
  group: apply-079-validator-fix
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ github.event.pull_request.number == 210 && github.head_ref == 'spec/079-minimal-continuation-definition' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify and apply the bounded patch
        shell: bash
        run: |
          set -euo pipefail
          echo "fe9f30bc5978a6f562ea257a37306566c71005895deaaa7e7fc8866b3fdb294d  scripts/.079-final-fix.patch" | sha256sum -c -
          echo "3281590488359d267a62df5211703f6339809916e98e6e9ac48c1d0043f0334c  .github/workflows/daily-development-continuation.yml" | sha256sum -c -
          git apply --index --whitespace=error-all scripts/.079-final-fix.patch
          git rm scripts/.079-final-fix.patch
          echo "34049af4fcb747c738e325b160e6586f0d6435b1879b34bd79fa39480fe968f2  scripts/daily_development_continuation.py" | sha256sum -c -
          echo "f75458526f7fad4b0e81d3747f51cc2d1bf095800abd59f282f2138ced9fe048  backend/tests/test_daily_development_continuation.py" | sha256sum -c -

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run focused deterministic gates
        run: |
          python -m pip install --disable-pip-version-check pytest pyyaml
          python -m py_compile scripts/daily_development_continuation.py backend/tests/test_daily_development_continuation.py
          python -m pytest -q --noconftest backend/tests/test_daily_development_continuation.py
          python - <<'PY'
          from pathlib import Path
          import yaml
          yaml.safe_load(Path('.github/workflows/daily-development-continuation.yml').read_text())
          print('workflow YAML: OK')
          PY
          git diff --cached --check

      - name: Publish only from the exact event head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags origin \
            "refs/heads/$HEAD_REF:refs/remotes/origin/$HEAD_REF"
          test "$(git rev-parse refs/remotes/origin/$HEAD_REF)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --no-verify -m "Harden spec 079 trusted validator boundary"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push origin \
            "HEAD:refs/heads/$HEAD_REF"
