name: Hermes GLM Worker Experiment

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/hermes-glm-worker-experiment.yml
      - docs/experiments/HERMES_GLM_WORKER_EXPERIMENT_2026-08-28.md

permissions:
  contents: read

concurrency:
  group: hermes-glm-worker-experiment-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  read-only-smoke:
    if: github.event.pull_request.head.ref == 'experiment/hermes-glm-worker'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Prove exact clean checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Install pinned Hermes Agent core once
        shell: bash
        env:
          HERMES_UPSTREAM_SHA: 306db2776c6b6f1acc85c31c4dabba3263f0e9fd
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-agent"
          git -C "$RUNNER_TEMP/hermes-agent" checkout --detach "$HERMES_UPSTREAM_SHA"
          test "$(git -C "$RUNNER_TEMP/hermes-agent" rev-parse HEAD)" = "$HERMES_UPSTREAM_SHA"
          python -m pip install --disable-pip-version-check -e "$RUNNER_TEMP/hermes-agent"
          hermes --version

      - name: Prepare minimal paid smoke prompt
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hermes-safe-write" "$RUNNER_TEMP/hermes-smoke" "$RUNNER_TEMP/hermes-home"
          cat > "$RUNNER_TEMP/hermes-prompt.txt" <<EOF
          Read only AGENTS.md and docs/specs/STATUS.md from this JarvisOS checkout.
          Do not write or modify files. Do not inspect secrets or environment variables.
          Expected checkout HEAD: ${EXPECTED_HEAD}

          Return at most 180 words with exactly:
          # CURRENT_FRONT
          State the binding spec ID and lifecycle state from STATUS.md.
          # INVARIANTS
          State exactly three hard invariants from AGENTS.md.
          # VERDICT
          PASS if both files were read and the answer is evidence-grounded; otherwise PARTIAL or FAIL.
          Do not inspect any other repository file unless one of these two explicitly requires it.
          EOF

      - name: Run Hermes with GLM-5.3-Flash Coding Plan
        shell: bash
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GLM_BASE_URL: https://api.z.ai/api/coding/paas/v4
          HERMES_HOME: ${{ runner.temp }}/hermes-home
          HERMES_WRITE_SAFE_ROOT: ${{ runner.temp }}/hermes-safe-write
        run: |
          set -euo pipefail
          if [ -z "${GLM_API_KEY:-}" ]; then
            echo "GLM_API_KEY secret is unavailable to this workflow."
            exit 2
          fi
          test "$GLM_BASE_URL" = "https://api.z.ai/api/coding/paas/v4"
          cd "$GITHUB_WORKSPACE"
          PROMPT="$(cat "$RUNNER_TEMP/hermes-prompt.txt")"

          set +e
          timeout 180s hermes \
            --provider zai \
            --model glm-5.3-flash \
            --toolsets file \
            --ignore-user-config \
            --usage-file "$RUNNER_TEMP/hermes-smoke/usage.json" \
            -z "$PROMPT" \
            > "$RUNNER_TEMP/hermes-smoke/report.md" \
            2> "$RUNNER_TEMP/hermes-smoke/stderr.txt"
          rc=$?
          set -e

          HERMES_RC="$rc" python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "hermes-smoke"
          key = os.environ.get("GLM_API_KEY", "")
          report = (root / "report.md").read_text(encoding="utf-8", errors="replace") if (root / "report.md").exists() else ""
          usage_text = (root / "usage.json").read_text(encoding="utf-8", errors="replace") if (root / "usage.json").exists() else ""
          stderr = (root / "stderr.txt").read_text(encoding="utf-8", errors="replace") if (root / "stderr.txt").exists() else ""
          if key and (key in report or key in usage_text or key in stderr):
              raise SystemExit("Secret leak detected")

          usage = json.loads(usage_text) if usage_text else {}
          diagnostic = {
              "hermes_rc": int(os.environ.get("HERMES_RC", "-999")),
              "requested_provider": "zai",
              "requested_model": "glm-5.3-flash",
              "requested_base_url": "https://api.z.ai/api/coding/paas/v4",
              "credential_secret_name": "GLM_API_KEY",
              "provider": str(usage.get("provider", "")).lower(),
              "model": str(usage.get("model", "")).lower(),
              "api_calls": usage.get("api_calls"),
              "input_tokens": usage.get("input_tokens"),
              "output_tokens": usage.get("output_tokens"),
              "cached_tokens": usage.get("cached_tokens"),
              "reasoning_tokens": usage.get("reasoning_tokens"),
              "total_tokens": usage.get("total_tokens"),
              "estimated_cost_usd": usage.get("estimated_cost_usd"),
              "completed": bool(usage.get("completed")),
              "failed": bool(usage.get("failed")),
              "failure": str(usage.get("failure", ""))[:1000],
              "report_bytes": len(report.encode("utf-8")),
              "stderr": stderr[:1000],
          }
          (root / "diagnostic.json").write_text(json.dumps(diagnostic, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          if not usage_text:
              raise SystemExit("Hermes usage report missing")
          if diagnostic["failed"] or not diagnostic["completed"]:
              raise SystemExit(f"Hermes/provider run failed: {diagnostic['failure']!r}")
          if diagnostic["provider"] != "zai":
              raise SystemExit(f"Unexpected provider: {diagnostic['provider']!r}")
          if "glm-5.3-flash" not in diagnostic["model"]:
              raise SystemExit(f"Unexpected model: {diagnostic['model']!r}")
          if not (40 <= diagnostic["report_bytes"] <= 8192):
              raise SystemExit(f"Unexpected report size: {diagnostic['report_bytes']}")
          PY

          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

      - name: Prove Hermes did not mutate repository
        if: always()
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Upload bounded smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hermes-glm-5-3-flash-smoke-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/hermes-smoke/report.md
            ${{ runner.temp }}/hermes-smoke/usage.json
            ${{ runner.temp }}/hermes-smoke/diagnostic.json
          if-no-files-found: warn
          retention-days: 7
