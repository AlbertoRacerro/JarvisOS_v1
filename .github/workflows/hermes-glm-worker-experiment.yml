name: Hermes GLM Worker Experiment

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/hermes-glm-worker-experiment.yml
      - docs/experiments/HERMES_GLM_WORKER_EXPERIMENT_2026-08-28.md

permissions:
  contents: read

concurrency:
  group: hermes-glm-worker-experiment-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  read-only-smoke:
    if: github.event.pull_request.head.ref == 'experiment/hermes-glm-worker'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Prove exact clean checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Install pinned Hermes Agent core once
        shell: bash
        env:
          HERMES_UPSTREAM_SHA: 306db2776c6b6f1acc85c31c4dabba3263f0e9fd
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-agent"
          git -C "$RUNNER_TEMP/hermes-agent" checkout --detach "$HERMES_UPSTREAM_SHA"
          test "$(git -C "$RUNNER_TEMP/hermes-agent" rev-parse HEAD)" = "$HERMES_UPSTREAM_SHA"
          python -m pip install --disable-pip-version-check -e "$RUNNER_TEMP/hermes-agent"
          hermes --version

      - name: Prepare bounded smoke prompt
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hermes-safe-write" "$RUNNER_TEMP/hermes-smoke"
          cat > "$RUNNER_TEMP/hermes-prompt.txt" <<EOF
          You are an untrusted read-only preflight reviewer for JarvisOS_v1.
          Repository checkout expected HEAD: ${EXPECTED_HEAD}
          Use only available file tools. Do not write, patch, create, rename, delete, or modify files. Do not reveal credentials or environment variables.

          Read AGENTS.md, docs/specs/STATUS.md, and the relevant docs/specs/111* material that exists in this checkout.
          Return concise Markdown with exactly these headings:
          # HEAD
          # CURRENT_BINDING_FRONT
          # HARD_INVARIANTS
          # SPEC_111_OWNER_SEAM
          # MATERIAL_FAILURE_MODE
          # WORKER_VERDICT

          State unknown/unavailable rather than guessing. List at least three hard invariants. Identify one exact existing owner seam 111 must reuse and one material fail-closed failure mode.
          EOF

      - name: Compare free GLM Flash models through Hermes
        shell: bash
        env:
          GLM_API_KEY: ${{ secrets.JARVIS_HERMES_FREE }}
          GLM_BASE_URL: https://api.z.ai/api/paas/v4
          HERMES_WRITE_SAFE_ROOT: ${{ runner.temp }}/hermes-safe-write
        run: |
          set -euo pipefail
          if [ -z "${GLM_API_KEY:-}" ]; then
            echo "JARVIS_HERMES_FREE secret is unavailable to this workflow."
            exit 2
          fi
          test "$GLM_BASE_URL" = "https://api.z.ai/api/paas/v4"
          cd "$GITHUB_WORKSPACE"
          PROMPT="$(cat "$RUNNER_TEMP/hermes-prompt.txt")"

          for MODEL in glm-4.5-flash glm-4.6v-flash; do
            SLUG="${MODEL//./-}"
            OUT="$RUNNER_TEMP/hermes-smoke/$SLUG"
            mkdir -p "$OUT" "$RUNNER_TEMP/hermes-home-$SLUG"
            echo "=== Testing $MODEL ==="

            set +e
            HERMES_HOME="$RUNNER_TEMP/hermes-home-$SLUG" timeout 300s hermes \
              --provider zai \
              --model "$MODEL" \
              --toolsets file \
              --ignore-user-config \
              --usage-file "$OUT/usage.json" \
              -z "$PROMPT" \
              > "$OUT/report.md" \
              2> "$OUT/stderr.txt"
            rc=$?
            set -e

            MODEL="$MODEL" HERMES_RC="$rc" OUT="$OUT" python - <<'PY'
          import json, os
          from pathlib import Path

          model_requested = os.environ["MODEL"].lower()
          out = Path(os.environ["OUT"])
          key = os.environ.get("GLM_API_KEY", "")
          report = (out / "report.md").read_text(encoding="utf-8", errors="replace") if (out / "report.md").exists() else ""
          usage_text = (out / "usage.json").read_text(encoding="utf-8", errors="replace") if (out / "usage.json").exists() else ""
          stderr = (out / "stderr.txt").read_text(encoding="utf-8", errors="replace") if (out / "stderr.txt").exists() else ""
          if key and (key in report or key in usage_text or key in stderr):
              raise SystemExit("Secret leak detected in Hermes evidence")

          usage = json.loads(usage_text) if usage_text else {}
          provider = str(usage.get("provider", "")).lower()
          model = str(usage.get("model", "")).lower()
          failed = bool(usage.get("failed"))
          completed = bool(usage.get("completed"))
          failure = str(usage.get("failure", ""))
          estimated_cost = usage.get("estimated_cost_usd")
          size = len(report.encode("utf-8"))
          success = bool(
              usage_text
              and completed
              and not failed
              and provider == "zai"
              and model_requested in model
              and not (isinstance(estimated_cost, (int, float)) and estimated_cost > 0)
              and 40 <= size <= 65536
          )

          diagnostic = {
              "requested_provider": "zai",
              "requested_model": model_requested,
              "requested_base_url": "https://api.z.ai/api/paas/v4",
              "credential_secret_name": "JARVIS_HERMES_FREE",
              "hermes_rc": int(os.environ.get("HERMES_RC", "-999")),
              "provider": provider,
              "model": model,
              "api_calls": usage.get("api_calls"),
              "input_tokens": usage.get("input_tokens"),
              "output_tokens": usage.get("output_tokens"),
              "total_tokens": usage.get("total_tokens"),
              "estimated_cost_usd": estimated_cost,
              "completed": completed,
              "failed": failed,
              "semantic_gate_success": success,
              "report_bytes": size,
              "failure": failure[:1200],
              "stderr": stderr[:1200],
          }
          (out / "diagnostic.json").write_text(json.dumps(diagnostic, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps({"model": model_requested, "success": success, "api_calls": usage.get("api_calls"), "failure": failure[:240]}))
          PY
          done

          python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "hermes-smoke"
          results = []
          for path in sorted(root.glob("*/diagnostic.json")):
              data = json.loads(path.read_text(encoding="utf-8"))
              results.append(data)
          if len(results) != 2:
              raise SystemExit(f"Expected diagnostics for two models, got {len(results)}")
          print("Free-model results:")
          for data in results:
              print(f"- {data['requested_model']}: success={data['semantic_gate_success']} calls={data['api_calls']} cost={data['estimated_cost_usd']} failure={data['failure'][:160]!r}")
          if not any(bool(data.get("semantic_gate_success")) for data in results):
              raise SystemExit("Neither free model completed successfully")
          PY

      - name: Prove Hermes did not mutate repository
        if: always()
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Upload bounded smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hermes-glm-free-model-comparison-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/hermes-smoke/*/report.md
            ${{ runner.temp }}/hermes-smoke/*/usage.json
            ${{ runner.temp }}/hermes-smoke/*/diagnostic.json
          if-no-files-found: warn
          retention-days: 7
