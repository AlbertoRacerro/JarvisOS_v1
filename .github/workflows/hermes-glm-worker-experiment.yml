name: Hermes GLM Worker Experiment

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/hermes-glm-worker-experiment.yml
      - docs/experiments/HERMES_GLM_WORKER_EXPERIMENT_2026-08-28.md

permissions:
  contents: read

concurrency:
  group: hermes-glm-worker-experiment-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  read-only-smoke:
    if: github.event.pull_request.head.ref == 'experiment/hermes-glm-worker'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Prove exact clean checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Install pinned Hermes Agent core
        shell: bash
        env:
          HERMES_UPSTREAM_SHA: 306db2776c6b6f1acc85c31c4dabba3263f0e9fd
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-agent"
          git -C "$RUNNER_TEMP/hermes-agent" checkout --detach "$HERMES_UPSTREAM_SHA"
          test "$(git -C "$RUNNER_TEMP/hermes-agent" rev-parse HEAD)" = "$HERMES_UPSTREAM_SHA"
          python -m pip install --disable-pip-version-check -e "$RUNNER_TEMP/hermes-agent"
          hermes --version

      - name: Prepare bounded smoke prompt
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hermes-home" "$RUNNER_TEMP/hermes-safe-write" "$RUNNER_TEMP/hermes-smoke"
          cat > "$RUNNER_TEMP/hermes-prompt.txt" <<EOF
          You are an untrusted read-only preflight reviewer for JarvisOS_v1.
          Repository checkout expected HEAD: ${EXPECTED_HEAD}
          Use only available file tools. Do not write, patch, create, rename, delete, or modify files. Do not reveal credentials or environment variables.

          Read AGENTS.md, docs/specs/STATUS.md, and the relevant docs/specs/111* material that exists in this checkout.
          Return concise Markdown with exactly these headings:
          # HEAD
          # CURRENT_BINDING_FRONT
          # HARD_INVARIANTS
          # SPEC_111_OWNER_SEAM
          # MATERIAL_FAILURE_MODE
          # WORKER_VERDICT

          State unknown/unavailable rather than guessing. List at least three hard invariants. Identify one exact existing owner seam 111 must reuse and one material fail-closed failure mode.
          EOF

      - name: Run Hermes with GLM-4.7-Flash free tier and gate output
        shell: bash
        env:
          GLM_API_KEY: ${{ secrets.JARVIS_HERMES_FREE }}
          GLM_BASE_URL: https://api.z.ai/api/paas/v4
          HERMES_HOME: ${{ runner.temp }}/hermes-home
          HERMES_WRITE_SAFE_ROOT: ${{ runner.temp }}/hermes-safe-write
        run: |
          set -euo pipefail
          if [ -z "${GLM_API_KEY:-}" ]; then
            echo "JARVIS_HERMES_FREE secret is unavailable to this workflow."
            exit 2
          fi
          test "$GLM_BASE_URL" = "https://api.z.ai/api/paas/v4"

          cd "$GITHUB_WORKSPACE"
          PROMPT="$(cat "$RUNNER_TEMP/hermes-prompt.txt")"
          set +e
          timeout 300s hermes \
            --provider zai \
            --model glm-4.7-flash \
            --toolsets file \
            --ignore-user-config \
            --usage-file "$RUNNER_TEMP/hermes-smoke/usage.json" \
            -z "$PROMPT" \
            > "$RUNNER_TEMP/hermes-smoke/report.md" \
            2> "$RUNNER_TEMP/hermes-stderr.txt"
          rc=$?
          set -e

          HERMES_RC="$rc" python - <<'PY'
          import json, os
          from pathlib import Path

          key = os.environ.get("GLM_API_KEY", "")
          root = Path(os.environ["RUNNER_TEMP"])
          smoke = root / "hermes-smoke"
          report_path = smoke / "report.md"
          usage_path = smoke / "usage.json"
          stderr_path = root / "hermes-stderr.txt"
          report = report_path.read_text(encoding="utf-8", errors="replace") if report_path.exists() else ""
          usage_text = usage_path.read_text(encoding="utf-8", errors="replace") if usage_path.exists() else ""
          stderr = stderr_path.read_text(encoding="utf-8", errors="replace") if stderr_path.exists() else ""
          if key and (key in report or key in usage_text or key in stderr):
              raise SystemExit("Secret leak detected in Hermes evidence")

          usage = json.loads(usage_text) if usage_text else {}
          provider = str(usage.get("provider", "")).lower()
          model = str(usage.get("model", "")).lower()
          failed = bool(usage.get("failed"))
          completed = bool(usage.get("completed"))
          failure = str(usage.get("failure", ""))
          estimated_cost = usage.get("estimated_cost_usd")
          size = len(report.encode("utf-8"))

          diagnostic = {
              "hermes_rc": int(os.environ.get("HERMES_RC", "-999")),
              "requested_provider": "zai",
              "requested_model": "glm-4.7-flash",
              "requested_base_url": "https://api.z.ai/api/paas/v4",
              "credential_secret_name": "JARVIS_HERMES_FREE",
              "provider": provider,
              "model": model,
              "api_calls": usage.get("api_calls"),
              "input_tokens": usage.get("input_tokens"),
              "output_tokens": usage.get("output_tokens"),
              "total_tokens": usage.get("total_tokens"),
              "estimated_cost_usd": estimated_cost,
              "completed": completed,
              "failed": failed,
              "report_bytes": size,
              "failure": failure[:1000],
              "stderr": stderr[:1000],
          }
          (smoke / "diagnostic.json").write_text(json.dumps(diagnostic, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          if not usage_text:
              raise SystemExit("Hermes usage report missing")
          if failed or not completed:
              raise SystemExit(f"Hermes/provider run failed: {failure[:400]!r}")
          if provider != "zai":
              raise SystemExit(f"Unexpected provider: {provider!r}")
          if "glm-4.7-flash" not in model:
              raise SystemExit(f"Unexpected model: {model!r}")
          if isinstance(estimated_cost, (int, float)) and estimated_cost > 0:
              raise SystemExit(f"Free-tier smoke reported non-zero estimated cost: {estimated_cost}")
          if size < 40 or size > 65536:
              raise SystemExit(f"Hermes report size outside bounds: {size}")
          PY

          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

      - name: Prove Hermes did not mutate repository
        if: always()
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Upload bounded smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hermes-glm-read-only-smoke-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/hermes-smoke/report.md
            ${{ runner.temp }}/hermes-smoke/usage.json
            ${{ runner.temp }}/hermes-smoke/diagnostic.json
          if-no-files-found: warn
          retention-days: 7
