name: ANALYTICS-DOCK Browser Proof

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  verify-analytics-dock:
    if: github.head_ref == 'verify-089-browser-b56d650' || github.ref == 'refs/heads/verify-089-browser-b56d650'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_ANALYTICS_DOCK_BROWSER_PROOF: "true"
      TARGET_IMPLEMENTATION_SHA: "5471cc240c91f5076ef9ddb8bd556de9567b1740"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install proof dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run exact-head ANALYTICS-DOCK browser proof
        run: RUN_ANALYTICS_DOCK_BROWSER_PROOF=true TARGET_IMPLEMENTATION_SHA="$TARGET_IMPLEMENTATION_SHA" python -m pytest -q backend/tests/test_analytics_dock_browser_verification.py -s
