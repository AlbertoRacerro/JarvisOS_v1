name: Apply 079 Final P1 Fixes

on:
  pull_request:

concurrency:
  group: apply-079-final-p1
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ github.event.pull_request.number == 210 && github.head_ref == 'spec/079-minimal-continuation-definition' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Apply, verify and publish bounded fixes
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f scripts/.079-final-p1.patch ]; then
            echo "Patch already consumed; no action."
            exit 0
          fi
          echo "bd32122ccca7ecb954bda502575a47845d03b8a8c60b01c088d6cfbd2e7a3c82  scripts/.079-final-p1.patch" | sha256sum -c -
          git apply --index --whitespace=error-all scripts/.079-final-p1.patch
          cp .github/workflows/daily-development-continuation.yml scripts/.079-daily-final.yml
          git restore --source=HEAD --staged --worktree .github/workflows/daily-development-continuation.yml
          git rm scripts/.079-final-p1.patch

          python -m pip install --disable-pip-version-check pytest pyyaml
          python -m py_compile scripts/daily_development_continuation.py backend/tests/test_daily_development_continuation.py
          python -m pytest -q --noconftest backend/tests/test_daily_development_continuation.py
          python - <<'PY'
          from pathlib import Path
          import yaml
          yaml.safe_load(Path('scripts/.079-daily-final.yml').read_text())
          print('workflow YAML: OK')
          PY

          git add scripts/daily_development_continuation.py \
            backend/tests/test_daily_development_continuation.py \
            scripts/.079-daily-final.yml
          git diff --cached --check

          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags origin \
            "refs/heads/$HEAD_REF:refs/remotes/origin/$HEAD_REF"
          test "$(git rev-parse refs/remotes/origin/$HEAD_REF)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --no-verify -m "Fix final spec 079 continuation gates"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push origin \
            "HEAD:refs/heads/$HEAD_REF"
