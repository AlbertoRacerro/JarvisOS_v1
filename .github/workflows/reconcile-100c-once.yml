name: Reconcile 100c registry once

on:
  push:
    branches:
      - reconcile/100c-queue-after-definition

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/100c-queue-after-definition
          fetch-depth: 2
      - name: Patch registry
        run: python scripts/reconcile_100c_tmp.py
      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "JarvisOS Roadmap Builder"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/reconcile-100c-once.yml scripts/reconcile_100c_tmp.py
          git add docs/specs/STATUS.md
          git commit -m "Reconcile 100c binding queue"
          git push origin HEAD:reconcile/100c-queue-after-definition
