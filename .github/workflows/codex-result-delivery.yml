name: Codex Result Delivery Dispatch

on:
  issue_comment:
    types: [created]

# One immutable comment can dispatch at most one delivery attempt. The downstream
# cloud-delivery bridge owns CAS, path admission, validation and the actual push.
concurrency:
  group: codex-result-delivery-${{ github.event.comment.id }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: write

jobs:
  dispatch:
    if: >-
      github.event.issue.pull_request &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.user.login == 'chatgpt-codex-connector[bot]') &&
      contains(github.event.comment.body, '<!-- jarvis-codex-result-delivery:v1 -->')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted dispatcher from default branch
        uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bind immutable comment to downstream delivery inputs
        id: bind
        run: |
          python scripts/codex_result_delivery_dispatch.py \
            --event "$GITHUB_EVENT_PATH" \
            --output "$GITHUB_OUTPUT"

      - name: Dispatch existing trusted cloud-delivery bridge
        uses: actions/github-script@v7
        env:
          INPUT_PR: ${{ steps.bind.outputs.pr }}
          INPUT_COMMENT_ID: ${{ steps.bind.outputs.comment_id }}
          INPUT_BODY_SHA256: ${{ steps.bind.outputs.payload_body_sha256 }}
        with:
          script: |
            const pr = process.env.INPUT_PR;
            const commentId = process.env.INPUT_COMMENT_ID;
            const bodySha = process.env.INPUT_BODY_SHA256;
            if (!/^\d+$/.test(pr ?? '')) throw new Error('invalid PR binding');
            if (!/^\d+$/.test(commentId ?? '')) throw new Error('invalid comment binding');
            if (!/^[0-9a-f]{64}$/.test(bodySha ?? '')) throw new Error('invalid body digest binding');
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'cloud-delivery-bridge.yml',
              ref: 'master',
              inputs: {
                pr,
                payload_comment_id: commentId,
                payload_body_sha256: bodySha,
              },
            });
