name: Apply 079 CODEOWNERS Fix

on:
  pull_request:

concurrency:
  group: apply-079-codeowners-fix
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ github.event.pull_request.number == 210 && github.head_ref == 'spec/079-minimal-continuation-definition' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Apply and verify CODEOWNERS protection
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f scripts/.079-codeowners-transform.py ]; then
            echo "Transformer already consumed; no action."
            exit 0
          fi
          test "$(git hash-object scripts/.079-codeowners-transform.py)" = "87dcce9ad976307eef5291fb020bb052e62c1568"

          python scripts/.079-codeowners-transform.py
          python -m pip install --disable-pip-version-check pytest
          python -m py_compile scripts/daily_development_continuation.py \
            backend/tests/test_daily_development_continuation.py
          python -m pytest -q --noconftest \
            backend/tests/test_daily_development_continuation.py
          git rm -f scripts/.079-codeowners-transform.py
          git add scripts/daily_development_continuation.py \
            backend/tests/test_daily_development_continuation.py
          git diff --cached --check

          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags origin \
            "refs/heads/$HEAD_REF:refs/remotes/origin/$HEAD_REF"
          test "$(git rev-parse refs/remotes/origin/$HEAD_REF)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --no-verify -m "Protect docs CODEOWNERS from continuation"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push origin \
            "HEAD:refs/heads/$HEAD_REF"
