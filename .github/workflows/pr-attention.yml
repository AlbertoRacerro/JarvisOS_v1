name: PR Attention Evidence

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Collect exact-head advisory evidence
        id: attention
        uses: AlbertoRacerro/jarvis-pr-attention/cycle@c544e2885a69173c58feb2355bb53e8866e627eb
        with:
          repository: ${{ github.repository }}
          pr-number: ${{ github.event.pull_request.number }}
          expected-head: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ github.token }}
      - name: Verify observed head
        shell: bash
        run: |
          test "${{ steps.attention.outputs.head-sha }}" = "${{ github.event.pull_request.head.sha }}"
      - name: Publish advisory summary
        if: always()
        shell: bash
        run: |
          {
            echo '## PR attention evidence (advisory only)'
            echo ''
            echo "Exact event head: `${{ github.event.pull_request.head.sha }}`"
            echo "Observed head: `${{ steps.attention.outputs.head-sha }}`"
            echo "Attention: `${{ steps.attention.outputs.attention }}`"
            echo "Gate status: `${{ steps.attention.outputs.gate-status }}`"
            echo "Semantic status: `${{ steps.attention.outputs.semantic-status }}`"
            echo "Safety status: `${{ steps.attention.outputs.safety-status }}`"
            echo "Merge candidate: `${{ steps.attention.outputs.merge-candidate }}`"
            echo ''
            echo 'These values are evidence only. JarvisOS semantic acceptance, queue state and merge authority remain external to this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
