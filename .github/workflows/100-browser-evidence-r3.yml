name: 100 Browser Evidence R3
on:
  push:
    branches: [evidence/100-browser-db259123-r3]
permissions:
  contents: read
jobs:
  browser-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Prove product tree matches frozen head
        run: |
          git fetch --no-tags --depth=1 origin db2591239a4ba22906157898b5ba83eb1e03e9a0
          git diff --exit-code db2591239a4ba22906157898b5ba83eb1e03e9a0 -- frontend ':!frontend/evidence/100-browser.mjs' backend schemas docs/specs/STATUS.md
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Install evidence-only Playwright
        working-directory: frontend
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium firefox
      - name: Start production preview
        working-directory: frontend
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/jarvisos-100-vite.log 2>&1 &
          for i in $(seq 1 30); do if curl --fail --silent http://127.0.0.1:4173/design/model >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/jarvisos-100-vite.log; exit 1
      - name: Run Chromium and Firefox visual matrix
        working-directory: frontend
        run: node evidence/100-browser.mjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 100-browser-evidence-db259123-r3
          path: |
            frontend/reports/100-browser/**
            /tmp/jarvisos-100-vite.log
          if-no-files-found: warn
