name: AI-THREADS Browser Proof

on:
  pull_request:
    branches: [spec/090-ai-threads-0]
  workflow_dispatch:

jobs:
  verify-ai-threads:
    if: github.head_ref == 'verify-090-browser-c5b68dc' || github.ref == 'refs/heads/verify-090-browser-c5b68dc'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_IMPLEMENTATION_SHA: "543342595e0453423c3d2712fe1cca1e5f158c0a"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install proof dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Materialize exact implementation head
        run: |
          git fetch origin spec/090-ai-threads-0 --depth=200
          test "$(git rev-parse FETCH_HEAD)" = "$TARGET_IMPLEMENTATION_SHA"
          git worktree add --detach /tmp/target "$TARGET_IMPLEMENTATION_SHA"
      - name: Run exact-head deterministic gates
        working-directory: /tmp/target
        run: |
          python scripts/check_spec_status.py --self-test
          python scripts/check_ai_threads.py --self-test
          python scripts/check_ai_threads.py
          python -m pytest -q backend/tests/test_ai_threads.py backend/tests/test_ai_egress_schema.py backend/tests/test_flow_grade_schema_registry.py
      - name: Build exact-head frontend and harness
        working-directory: /tmp/target/frontend
        run: |
          npm ci
          ./node_modules/.bin/esbuild src/components/threads/threadStateHarness.ts --bundle --platform=node --format=cjs --outfile=/tmp/threadStateHarness.cjs
          node /tmp/threadStateHarness.cjs
          npm run build
          npm install --no-save --package-lock=false playwright@1.54.2
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Extract browser scenario
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path('backend/tests/test_ai_threads_browser_verification.py')
          spec = importlib.util.spec_from_file_location('proof', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          script = module.SCRIPT
          old = 'await page.getByRole("button",{name:/Current A/i}).click(); await page.getByText("CURRENT-X",{exact:true}).waitFor();'
          new = 'await page.getByRole("button",{name:/Thread Y/i}).click(); await page.getByRole("button",{name:/Current A/i}).click(); await page.getByText("CURRENT-X",{exact:true}).waitFor();'
          if old not in script:
              raise SystemExit('expected browser-proof sequence not found')
          script = script.replace(old, new, 1)
          Path('/tmp/target/frontend/.ai-threads-proof.mjs').write_text(script, encoding='utf-8')
          PY
      - name: Run browser proof
        working-directory: /tmp/target/frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 >/tmp/vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID || true' EXIT
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:5173/ai-threads >/dev/null && break; sleep 0.25; done
          node .ai-threads-proof.mjs
