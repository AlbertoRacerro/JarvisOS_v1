name: 092 Browser Evidence 0a2a398c

on:
  push:
    branches:
      - evidence/092-browser-0a2a398c
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/092-browser-evidence.yml'

permissions:
  contents: read

jobs:
  browser-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Prove product tree matches frozen PR head
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin 0a2a398cca8bc34988cd7d7d3e6d1cf1753b99aa
          git diff --exit-code 0a2a398cca8bc34988cd7d7d3e6d1cf1753b99aa -- frontend backend schemas

      - name: Materialize reviewed 13-case harness
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin evidence/092-browser-858b4977
          mkdir -p scripts/evidence
          git show FETCH_HEAD:scripts/evidence/092-browser-evidence.mjs > scripts/evidence/092-browser-evidence.mjs
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/evidence/092-browser-evidence.mjs')
          text = p.read_text(encoding='utf-8')
          text = text.replace('858b49777500d3137435321a85a63ed863691c1c', '0a2a398cca8bc34988cd7d7d3e6d1cf1753b99aa')
          text = text.replace(
              'if (["POST", "PUT", "PATCH", "DELETE"].includes(request.method())) mutationRequests.push(`${request.method()} ${url}`);\n  if (url.includes("/ai/") || url.includes("provider")) providerRequests.push(`${request.method()} ${url}`);',
              'const isContextPreview = url.includes("/ai/context/packs/preview");\n  if (["POST", "PUT", "PATCH", "DELETE"].includes(request.method()) && !isContextPreview) mutationRequests.push(`${request.method()} ${url}`);\n  if ((url.includes("/ai/") || url.includes("provider")) && !isContextPreview) providerRequests.push(`${request.method()} ${url}`);'
          )
          text = text.replace(
              'if (req.method() !== "GET") return json({ error: "mutation forbidden in evidence" }, 409);',
              'if (req.method() === "POST" && p === "/ai/context/packs/preview") return json({ context_digest: null, context_sources_manifest: [], char_count: 0, estimated_token_count: 0, included_count: 0, dropped_count: 0, budget_chars: 0 });\n  if (req.method() !== "GET") return json({ error: "mutation forbidden in evidence" }, 409);'
          )
          text = text.replace(
              'if (/\\/model-implementations$/.test(p) || /\\/parameters$/.test(p) || /\\/ai\\/threads/.test(p)) return json([]);',
              'if (/\\/model-implementations$/.test(p) || /\\/parameters$/.test(p)) return json([]);\n  if (/\\/ai\\/threads/.test(p)) return json({ threads: [] });'
          )
          text = text.replace(
              'await page.goto(BASE_URL);\nawait page.getByRole("heading", { name: "Model workbench" }).waitFor();\nawait page.getByRole("button", { name: "Show navigator" }).click();',
              'page.on("pageerror", (error) => console.log(`MATRIX_PAGEERROR: ${error.message}`));\nawait page.goto(BASE_URL);\nawait page.getByRole("heading", { name: "Model workbench" }).waitFor();\nawait page.waitForTimeout(500);\nconst navigatorToggle = page.getByRole("button", { name: /Show navigator|Hide navigator/ });\nif ((await navigatorToggle.first().textContent())?.includes("Show")) await navigatorToggle.first().click();'
          )
          old_choose = '''  await page.getByRole("button", { name: /Show context|Hide context/ }).click().catch(() => {});\n  const context = page.getByRole("button", { name: "Show context" });\n  if (await context.count()) await context.click();\n  await page.getByRole("tab", { name: "Properties" }).click();\n  await page.getByLabel("Inspectable mesh").waitFor({ timeout: 10000 });'''
          new_choose = '''  const contextToggle = page.getByRole("button", { name: /Show context|Hide context/ });\n  if ((await contextToggle.count()) && (await contextToggle.first().textContent())?.includes("Show")) await contextToggle.first().click();\n  const propertiesTab = page.getByRole("tab", { name: "Properties" });\n  if ((await propertiesTab.count()) && await propertiesTab.first().isVisible()) await propertiesTab.first().click();\n  const stageSummary = page.getByText("Current stage context", { exact: true });\n  if ((await stageSummary.count()) && await stageSummary.first().isVisible()) {\n    const details = stageSummary.first().locator("xpath=..")\n    if (!(await details.getAttribute("open"))) await stageSummary.first().click();\n  }\n  await page.getByLabel("Inspectable mesh").waitFor({ state: "visible", timeout: 10000 });'''
          if old_choose not in text:
              raise SystemExit('expected choose block not found')
          text = text.replace(old_choose, new_choose)
          text = text.replace(
              '  const body = (await page.locator("body").textContent()) ?? "";\n  assert(body.includes("Unresolved engineering binding"), "historical unbound hit lacks explicit unresolved engineering-binding state");',
              '  const properties = await semanticText(page);\n  assert(properties.includes("Unresolved engineering binding"), "historical unbound hit lacks primary Properties unresolved state");'
          )
          p.write_text(text, encoding='utf-8')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and transient browser harness
        shell: bash
        run: |
          cd frontend
          npm ci
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
          cd ..
          ln -s frontend/node_modules node_modules

      - name: Build frozen frontend
        shell: bash
        run: |
          cd frontend
          npm run build

      - name: Start preview
        shell: bash
        run: |
          cd frontend
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/jarvisos-vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/design/model >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/jarvisos-vite.log
          exit 1

      - name: Run 092 browser matrix
        shell: bash
        run: node scripts/evidence/092-browser-evidence.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 092-browser-evidence-0a2a398c
          path: |
            reports/092-browser-evidence.json
            reports/092-browser-evidence/*.png
            /tmp/jarvisos-vite.log
          if-no-files-found: warn
