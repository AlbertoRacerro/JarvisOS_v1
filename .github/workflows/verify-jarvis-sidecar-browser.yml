name: JARVIS-SIDECAR Browser Proof

on:
  pull_request:
    branches: [spec/091-jarvis-sidecar-1]
  workflow_dispatch:

jobs:
  verify-jarvis-sidecar:
    if: github.head_ref == 'verify-091-sidecar-3002726' || github.ref == 'refs/heads/verify-091-sidecar-3002726'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_IMPLEMENTATION_SHA: "b6e2eb1eb5b0bfe47991fd52ab5313e2542cb7a0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install proof dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Materialize exact implementation head
        run: |
          git fetch origin spec/091-jarvis-sidecar-1 --depth=200
          test "$(git rev-parse FETCH_HEAD)" = "$TARGET_IMPLEMENTATION_SHA"
          git worktree add --detach /tmp/target "$TARGET_IMPLEMENTATION_SHA"
      - name: Run exact-head deterministic gates
        working-directory: /tmp/target
        run: |
          python scripts/check_spec_status.py --self-test
          python scripts/check_ai_threads.py --self-test
          python scripts/check_jarvis_sidecar.py --self-test
          python scripts/check_jarvis_sidecar.py
          python -m pytest -q backend/tests/test_ai_threads.py
          python - <<'PY'
          from pathlib import Path
          app = Path('frontend/src/App.tsx').read_text(encoding='utf-8')
          layout = Path('frontend/src/components/Layout.tsx').read_text(encoding='utf-8')
          sidecar = Path('frontend/src/components/shell/ContextualSidecar.tsx').read_text(encoding='utf-8')
          required = {
              'App sidecar composition': 'sidecar: jarvisSidecar' in app and 'AnalyticsDockContent' in app,
              'Layout sidecar toggle': 'aria-controls="shell-sidecar"' in layout and 'closeSidecar' in layout,
              'Escape close': 'event.key === "Escape"' in sidecar,
              'sidecar focus target': 'headingRef.current?.focus()' in sidecar,
          }
          missing = [name for name, ok in required.items() if not ok]
          if missing:
              raise SystemExit('preservation invariant failed: ' + ', '.join(missing))
          PY
      - name: Build exact-head frontend
        working-directory: /tmp/target/frontend
        run: |
          npm ci
          npm run build
          npm install --no-save --package-lock=false playwright@1.54.2
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Stage browser proof
        run: |
          cp backend/tests/test_jarvis_sidecar_browser_verification.mjs /tmp/target/frontend/.jarvis-sidecar-proof.mjs
          cp backend/tests/test_jarvis_sidecar_browser_matrix.mjs /tmp/target/frontend/.jarvis-sidecar-matrix.mjs
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/target/frontend/.jarvis-sidecar-matrix.mjs')
          text = path.read_text(encoding='utf-8')
          for digest in ('digestA', 'digestRoute'):
              text = text.replace(f'page.getByText({digest}).waitFor()', f'page.getByText({digest}).waitFor({{ state: "attached" }})')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Run browser proof
        working-directory: /tmp/target/frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 >/tmp/vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID || true' EXIT
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:5173/runs >/dev/null && break; sleep 0.25; done
          node .jarvis-sidecar-proof.mjs
          node .jarvis-sidecar-matrix.mjs
