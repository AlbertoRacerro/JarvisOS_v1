name: repair-124-one-shot

on:
  push:
    branches:
      - impl/124-provider-settings-generic
    paths:
      - .github/workflows/repair-124-one-shot.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/124-provider-settings-generic
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded repair
        run: python .github/repair_124.py
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run focused provider-settings tests
        working-directory: backend
        run: python -m pytest -q tests/test_provider_settings.py
      - name: Run focused Ruff
        working-directory: backend
        run: python -m ruff check app/modules/ai/egress_persistence.py tests/test_provider_settings.py
      - name: Commit and push product repair
        run: |
          git config user.name "jarvisos-frontier-builder"
          git config user.email "actions@users.noreply.github.com"
          git add backend/app/modules/ai/egress_persistence.py backend/tests/test_provider_settings.py
          git diff --cached --check
          git commit -m "fix(spec-124): align read availability blockers"
          git push origin HEAD:impl/124-provider-settings-generic
