name: RUNS Workbench Browser Proof

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  verify-runs-workbench:
    if: github.head_ref == 'verify-088-browser-95a9603' || github.ref == 'refs/heads/verify-088-browser-95a9603'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_RUNS_BROWSER_PROOF: "true"
      TARGET_IMPLEMENTATION_SHA: "f26c5589dd667db6004f45831e34aa3630928fdb"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install browser-proof dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Correct evidence-only status locator
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("backend/tests/test_runs_workbench_browser_verification.py")
          source = path.read_text(encoding="utf-8")
          old = 'await page.getByText("succeeded", { exact: true }).first().waitFor();'
          new = 'await page.locator(".run-status").filter({ hasText: /^succeeded$/ }).waitFor();'
          if source.count(old) != 1:
              raise SystemExit("expected exactly one ambiguous status locator")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY
      - name: Run exact-head RUNS browser proof
        run: |
          RUN_RUNS_BROWSER_PROOF=true TARGET_IMPLEMENTATION_SHA="$TARGET_IMPLEMENTATION_SHA" python -m pytest -q backend/tests/test_runs_workbench_browser_verification.py -s
