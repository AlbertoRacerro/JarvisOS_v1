name: BLUECAD Workbench Browser Proof

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  verify-bluecad-workbench:
    if: github.head_ref == 'verify-085-browser-3abd0ff' || github.ref == 'refs/heads/verify-085-browser-3abd0ff'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUN_BLUECAD_WORKBENCH_BROWSER_PROOF: "true"
      TARGET_IMPLEMENTATION_SHA: "ff5b80af901c2a1bfbec88352eb762e2ee176105"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run exact-head BLUECAD workbench browser proof
        working-directory: backend
        run: |
          sed -i "s/^TARGET_SHA = .*/TARGET_SHA = \"${TARGET_IMPLEMENTATION_SHA}\"/" tests/test_bluecad_workbench_browser_verification.py
          sed -i 's/fixture parked after two failed attempts/attempts_exhausted/g' tests/test_bluecad_workbench_browser_verification.py
          sed -i 's/  const before = await canvas.boundingBox();/  await page.setViewportSize({ width: 1280, height: 720 });\n  await page.waitForTimeout(250);\n  const before = await canvas.boundingBox();/' tests/test_bluecad_workbench_browser_verification.py
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_bluecad_workbench_browser_verification.py")
          body = path.read_text(encoding="utf-8")
          old = r'await page.getByText(/values: \[1,2\]/).waitFor();'
          new = r'await page.getByText(/values: \[2 items\]/).waitFor();'
          if old not in body:
              raise SystemExit("expected validation browser assertion was not found")
          path.write_text(body.replace(old, new, 1), encoding="utf-8")
          PY
          set +e
          python -m pytest -q tests/test_bluecad_workbench_browser_verification.py -s
          status=$?
          echo "--- BLUECAD browser proof server logs ---"
          find /tmp/pytest-of-runner -name fastapi.log -type f -print -exec cat {} \; 2>/dev/null || true
          exit "$status"
