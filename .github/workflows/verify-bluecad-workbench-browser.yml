name: TEMP BLUECAD Workbench Browser Verification

on:
  pull_request:
    paths:
      - .github/workflows/verify-bluecad-workbench-browser.yml

permissions:
  contents: read

jobs:
  exact-head-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_SHA: 3abd0ff142ace87fe250f0b2d531dd0607a0966e
      JARVISOS_DATA_ROOT: ${{ runner.temp }}/jarvisos-bluecad-proof
      JARVISOS_AI_PROVIDER: none
      JARVISOS_ENV: browser-verification
      BASE_URL: http://127.0.0.1:8000
      PROOF_REPORT: ${{ runner.temp }}/bluecad-workbench-proof.json

    steps:
      - name: Checkout exact 085 head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1

      - name: Verify exact clean checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --short)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frozen deterministic frontend gates
        shell: bash
        run: |
          python scripts/check_app_shell.py
          python scripts/check_bluecad_read_model.py
          python scripts/check_bluecad_workbench.py
          cd frontend
          npm ci
          npm run build
          cd ..
          mkdir -p "$RUNNER_TEMP/browser-tools"
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-save --package-lock=false tsx@4.20.3 playwright@1.54.2
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/tsx" frontend/src/components/bluecad/workbenchStateHarness.ts
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/playwright" install --with-deps chromium
          test -z "$(git status --short)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend and seed isolated real BLUECAD state
        working-directory: backend
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          mkdir -p "$JARVISOS_DATA_ROOT"
          python -m app.core.bootstrap
          python - <<'PY'
          import json, struct
          from pathlib import Path
          from app.core.database import open_sqlite_connection
          from app.modules.bluecad.ledger import create_candidate_record, mark_candidate_valid, register_artifact, update_candidate_artifacts
          from app.modules.bluecad.models import BluecadLoopConfig

          with open_sqlite_connection() as connection:
              row = connection.execute("SELECT id FROM workspaces ORDER BY created_at LIMIT 1").fetchone()
              if row is None:
                  raise SystemExit("default workspace missing")
              workspace_id = str(row["id"])
              connection.execute("UPDATE workspaces SET name = ? WHERE id = ?", ("BLUECAD-" + "LONGWORKSPACENAME" * 12, workspace_id))
              connection.commit()

          candidate = create_candidate_record(workspace_id, "Browser proof valid candidate", BluecadLoopConfig())
          gltf = {
              "asset": {"version": "2.0"},
              "scene": 0,
              "scenes": [{"nodes": [0]}],
              "nodes": [{"mesh": 0}],
              "meshes": [{"primitives": [{"attributes": {"POSITION": 0}}]}],
              "buffers": [{"byteLength": 36}],
              "bufferViews": [{"buffer": 0, "byteOffset": 0, "byteLength": 36, "target": 34962}],
              "accessors": [{"bufferView": 0, "componentType": 5126, "count": 3, "type": "VEC3", "min": [0, 0, 0], "max": [1, 1, 0]}],
          }
          json_bytes = json.dumps(gltf, separators=(",", ":")).encode()
          json_bytes += b" " * ((4 - len(json_bytes) % 4) % 4)
          bin_bytes = struct.pack("<9f", 0,0,0, 1,0,0, 0,1,0)
          total = 12 + 8 + len(json_bytes) + 8 + len(bin_bytes)
          glb = struct.pack("<III", 0x46546C67, 2, total)
          glb += struct.pack("<II", len(json_bytes), 0x4E4F534A) + json_bytes
          glb += struct.pack("<II", len(bin_bytes), 0x004E4942) + bin_bytes
          source = Path("/tmp/bluecad-proof.glb")
          source.write_bytes(glb)
          glb_id = register_artifact(workspace_id, source, role="bluecad_glb", source_ref=f"bluecad_candidate:{candidate.id}", producer_notes="Temporary exact-head browser proof fixture.")
          update_candidate_artifacts(candidate.id, spec_artifact_id=None, glb_artifact_id=glb_id, report_artifact_id=None)
          mark_candidate_valid(candidate.id)
          Path("/tmp/bluecad-proof-seed.json").write_text(json.dumps({"workspace_id": workspace_id, "candidate_id": candidate.id, "glb_artifact_id": glb_id}))
          PY

      - name: Start production app
        shell: bash
        run: |
          (cd backend && python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/fastapi.log" 2>&1 & echo $! > "$RUNNER_TEMP/fastapi.pid")
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$BASE_URL/health" >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$BASE_URL/health" >/dev/null

      - name: Run BLUECAD browser lifecycle and accessibility proof
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/browser-tools/proof.mjs" <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const base = process.env.BASE_URL;
          const reportPath = process.env.PROOF_REPORT;
          const results = [];
          const errors = [];
          const assert = (value, message) => { if (!value) throw new Error(message); };
          async function check(name, fn) {
            try { await fn(); results.push({ name, status: 'PASS' }); }
            catch (error) { results.push({ name, status: 'FAIL', error: error?.stack ?? String(error) }); }
          }
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 640, height: 360 } });
          const page = await context.newPage();
          page.on('pageerror', e => errors.push(`page:${e.message}`));
          page.on('console', m => { if (m.type() === 'error') errors.push(`console:${m.text()}`); });

          await page.goto(`${base}/design/model`, { waitUntil: 'domcontentloaded' });
          await page.locator('#app-main').waitFor({ state: 'visible' });
          await page.getByRole('heading', { name: 'Model workbench' }).waitFor();

          await check('effective-200-percent-no-global-overflow', async () => {
            await page.getByRole('button', { name: 'Show navigator', exact: true }).click();
            await page.locator('#shell-navigator').waitFor();
            const size = await page.evaluate(() => ({ sw: document.documentElement.scrollWidth, cw: document.documentElement.clientWidth }));
            assert(size.sw <= size.cw + 1, `document overflow ${JSON.stringify(size)}`);
            const select = page.getByLabel('Workspace');
            const contained = await select.evaluate(el => {
              const a = el.getBoundingClientRect();
              const p = el.parentElement?.getBoundingClientRect();
              return !!p && a.left >= p.left - 1 && a.right <= p.right + 1;
            });
            assert(contained, 'long workspace selector exceeds navigator label');
          });

          await check('real-glb-loads-and-resizes-with-shell', async () => {
            await page.getByRole('button', { name: /Browser proof valid candidate/ }).click();
            await page.getByRole('img', { name: 'Interactive 3D preview of generated BLUECAD geometry' }).waitFor({ timeout: 15000 });
            await page.getByText('Orbit, pan, and zoom to inspect the generated geometry.').waitFor({ timeout: 15000 });
            const before = await page.getByRole('img', { name: 'Interactive 3D preview of generated BLUECAD geometry' }).boundingBox();
            await page.getByRole('button', { name: 'Show context', exact: true }).click();
            await page.waitForTimeout(200);
            const after = await page.getByRole('img', { name: 'Interactive 3D preview of generated BLUECAD geometry' }).boundingBox();
            assert(before && after && after.width !== before.width, `viewer did not resize ${JSON.stringify({before, after})}`);
            const doc = await page.evaluate(() => ({ sw: document.documentElement.scrollWidth, cw: document.documentElement.clientWidth }));
            assert(doc.sw <= doc.cw + 1, `panel-open overflow ${JSON.stringify(doc)}`);
          });

          await check('duplicate-brief-opens-navigator-and-focuses-textarea', async () => {
            if (await page.locator('#shell-navigator').count()) {
              await page.locator('#shell-navigator').press('Escape');
              await page.locator('#shell-navigator').waitFor({ state: 'detached' });
            }
            await page.getByRole('button', { name: 'Duplicate brief', exact: true }).click();
            const textarea = page.getByLabel('New candidate brief');
            await textarea.waitFor();
            await page.waitForFunction(() => document.activeElement?.tagName === 'TEXTAREA');
            assert((await textarea.inputValue()) === 'Browser proof valid candidate', 'duplicate brief did not preserve source text');
          });

          await check('create-refresh-archive-use-real-api', async () => {
            const textarea = page.getByLabel('New candidate brief');
            await textarea.fill('Browser proof created candidate');
            await page.getByRole('button', { name: 'New candidate', exact: true }).click();
            await page.getByText('Candidate created.').waitFor({ timeout: 15000 });
            await page.getByText('Browser proof created candidate', { exact: false }).first().waitFor();
            await page.getByRole('button', { name: 'Refresh', exact: true }).click();
            await page.getByRole('button', { name: 'Archive', exact: true }).waitFor();
            await page.getByRole('button', { name: 'Archive', exact: true }).click();
            await page.getByText('Candidate archived.').waitFor({ timeout: 15000 });
            assert(!(await page.getByText('Browser proof created candidate', { exact: false }).count()), 'archived candidate remained visible with Show archived off');
          });

          await check('promote-refresh-restores-keyboard-focus', async () => {
            const valid = page.getByRole('button', { name: /Browser proof valid candidate/ });
            await valid.click();
            const promote = page.getByRole('button', { name: 'Promote to Decision', exact: true });
            await promote.waitFor();
            await promote.focus();
            await promote.press('Enter');
            await page.getByText(/Promoted to Decision/).waitFor({ timeout: 15000 });
            await page.waitForTimeout(100);
            const focus = await page.evaluate(() => ({ tag: document.activeElement?.tagName, text: document.activeElement?.textContent ?? '', id: document.activeElement?.id ?? '' }));
            assert(focus.text.includes('Browser proof valid candidate') || focus.id === 'bluecad-workbench-title', `unexpected focus ${JSON.stringify(focus)}`);
          });

          await check('no-uncaught-browser-errors', async () => assert(errors.length === 0, errors.join('\n')));

          await context.close();
          await browser.close();
          const report = { schema: 'jarvisos.bluecad-workbench-browser-proof.v1', target_sha: process.env.TARGET_SHA, results, errors, summary: { passed: results.filter(x => x.status === 'PASS').length, failed: results.filter(x => x.status === 'FAIL').length } };
          fs.writeFileSync(reportPath, JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report, null, 2));
          if (report.summary.failed) process.exit(1);
          NODE
          cd "$RUNNER_TEMP/browser-tools"
          node proof.mjs
          cd "$GITHUB_WORKSPACE"
          test -z "$(git status --short)"

      - name: Upload exact-head browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bluecad-workbench-browser-proof-3abd0ff
          path: |
            ${{ runner.temp }}/bluecad-workbench-proof.json
            ${{ runner.temp }}/fastapi.log
            /tmp/bluecad-proof-seed.json
          if-no-files-found: warn
          retention-days: 14

      - name: Stop production app
        if: always()
        shell: bash
        run: |
          test ! -f "$RUNNER_TEMP/fastapi.pid" || kill "$(cat "$RUNNER_TEMP/fastapi.pid")" || true
