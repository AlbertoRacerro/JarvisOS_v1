name: Apply 079 Commit Proof V2

on:
  pull_request:

concurrency:
  group: apply-079-commit-proof-v2
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ github.event.pull_request.number == 210 && github.head_ref == 'spec/079-minimal-continuation-definition' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify chunks and reconstruct the bounded patch
        shell: bash
        run: |
          set -euo pipefail
          echo "5f1a2e5d8a28ff62be8b54f477cc77db0eb62014244e9d8eeaf15475d40b6038  scripts/.079cp.part10" | sha256sum -c -
          echo "5480ae50116f9394188581fa9a25fd09b498b08eef0c907820645a41f05da948  scripts/.079cp.part11" | sha256sum -c -
          echo "b474b65dcfcf5c70077be81e5d9416aea2aad8a7956311b74ab330dcc808d1a4  scripts/.079cp.part12" | sha256sum -c -
          echo "07c9493877e40c139fddf6c0620ad1c85b7ec2f6dc5b1244e8ff3d1878b1c7fa  scripts/.079cp.part13" | sha256sum -c -
          echo "07a8675ed1a9347aaab196502d179a0e1a328558ce42032b2073fd044efc4b7b  scripts/.079cp.part14" | sha256sum -c -
          echo "7dd58741b45909f7eda53922e78002a88474ba2e206ba0998b7081794a7d9f3d  scripts/.079cp.part15" | sha256sum -c -
          cat scripts/.079cp.part10 scripts/.079cp.part11 scripts/.079cp.part12 \
              scripts/.079cp.part13 scripts/.079cp.part14 scripts/.079cp.part15 \
              | base64 -d > "$RUNNER_TEMP/079-commit-proof.patch"
          echo "018f55f60703533bafc57eec8b5d17e9f35f8af99fea0c764514b07519a8d1fd  $RUNNER_TEMP/079-commit-proof.patch" | sha256sum -c -
          git apply --index --whitespace=error-all "$RUNNER_TEMP/079-commit-proof.patch"
          git rm scripts/.079cp.part00 scripts/.079cp.part01 \
            scripts/.079cp.part10 scripts/.079cp.part11 scripts/.079cp.part12 \
            scripts/.079cp.part13 scripts/.079cp.part14 scripts/.079cp.part15
          echo "2b1cbaf8f15cf80e2cad471bbfd7231a580b93a340cf800716108a36bcbcff55  scripts/daily_development_continuation.py" | sha256sum -c -
          echo "2b1b2a9e358642a184959798a9264dfaf8d53e0268a5c9567b2a814056cf3f3f  backend/tests/test_daily_development_continuation.py" | sha256sum -c -
          echo "04f2ab092165452cd4aa3bc1d5712d333d6310b12efdf11ff07ec57df10db8e1  .github/workflows/daily-development-continuation.yml" | sha256sum -c -

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run focused deterministic gates
        run: |
          python -m pip install --disable-pip-version-check pytest pyyaml
          python -m py_compile scripts/daily_development_continuation.py backend/tests/test_daily_development_continuation.py
          python -m pytest -q --noconftest backend/tests/test_daily_development_continuation.py
          python - <<'PY'
          from pathlib import Path
          import yaml
          yaml.safe_load(Path('.github/workflows/daily-development-continuation.yml').read_text())
          print('workflow YAML: OK')
          PY
          git diff --cached --check

      - name: Publish only from the exact event head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags origin \
            "refs/heads/$HEAD_REF:refs/remotes/origin/$HEAD_REF"
          test "$(git rev-parse refs/remotes/origin/$HEAD_REF)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --no-verify -m "Authenticate spec 079 recovery commits"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push origin \
            "HEAD:refs/heads/$HEAD_REF"
