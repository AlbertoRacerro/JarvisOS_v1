name: Pytest Focused Temporary

on:
  pull_request:

permissions:
  contents: write

# Temporary same-branch diagnostic and one-shot exact test patch; removed after use.
jobs:
  pytest-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Apply exact percent-conversion assertion fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/tests/test_process_kernel_075_contracts.py")
          text = path.read_text(encoding="utf-8")
          old = '    assert normalize_input_set(valid)["pump_efficiency"] == {"value": 0.35, "unit": "1"}\n'
          new = (
              '    normalized = normalize_input_set(valid)["pump_efficiency"]\n'
              '    assert normalized["unit"] == "1"\n'
              '    assert normalized["value"] == pytest.approx(0.35, rel=0.0, abs=1e-15)\n'
          )
          count = text.count(old)
          if count not in {0, 1}:
              raise SystemExit(f"unexpected replacement count: {count}")
          if count == 1:
              path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          if ! git diff --quiet -- backend/tests/test_process_kernel_075_contracts.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/tests/test_process_kernel_075_contracts.py
            git commit -m "Use tolerant percent normalization assertion"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Capture process-kernel regression output
        working-directory: backend
        shell: bash
        run: |
          set +e
          python -m pytest -q -x \
            tests/test_process_kernel_075*.py \
            tests/test_flowsheet_shared_topology.py \
            tests/test_bluerev_geometry_hydraulics_v0.py \
            tests/test_bluerev_geometry_hydraulics_v0_laminar.py \
            > "$RUNNER_TEMP/pytest-focused-output.txt" 2>&1
          status=$?
          echo "$status" > "$RUNNER_TEMP/pytest-focused-status.txt"
          exit 0
      - name: Upload focused pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-focused-temp
          path: |
            ${{ runner.temp }}/pytest-focused-output.txt
            ${{ runner.temp }}/pytest-focused-status.txt
          if-no-files-found: error
          retention-days: 1
