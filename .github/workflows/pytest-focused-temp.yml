name: Pytest Focused Temporary

on:
  pull_request:

# Temporary same-branch diagnostic; removed after reading the artifact.
jobs:
  pytest-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Capture runner and flowsheet regression output
        working-directory: backend
        shell: bash
        run: |
          set +e
          mapfile -t files < <(
            grep -rlE \
              'app\.modules\.(runner|flowsheet)|app\.core\.topology|input_contracts|local_python' \
              tests --include='test*.py' | sort
          )
          printf 'Selected %s files:\n' "${#files[@]}" > "$RUNNER_TEMP/pytest-focused-output.txt"
          printf '%s\n' "${files[@]}" >> "$RUNNER_TEMP/pytest-focused-output.txt"
          python -m pytest -q -x "${files[@]}" \
            >> "$RUNNER_TEMP/pytest-focused-output.txt" 2>&1
          status=$?
          echo "$status" > "$RUNNER_TEMP/pytest-focused-status.txt"
          exit 0
      - name: Upload focused pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-focused-temp
          path: |
            ${{ runner.temp }}/pytest-focused-output.txt
            ${{ runner.temp }}/pytest-focused-status.txt
          if-no-files-found: error
          retention-days: 1
