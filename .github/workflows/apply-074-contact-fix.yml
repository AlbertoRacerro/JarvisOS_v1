name: Apply 074 Contact Fix

on:
  push:
    branches: [impl-074]
    paths:
      - "scripts/apply_074_contact_fix.py"
      - ".github/workflows/apply-074-contact-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl-074
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Apply narrow contact patch
        run: python scripts/apply_074_contact_fix.py

      - name: Verify narrow patch
        working-directory: backend
        run: |
          python -m ruff check app/modules/bluecad/cad_link_topology_preflight.py tests/bluecad/test_cad_link_topology_preflight.py
          python -m pytest -q tests/bluecad/test_cad_link_topology_preflight.py::test_kernel_preflight_closes_parallel_headers_without_writes
          git diff --check

      - name: Push verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/modules/bluecad/cad_link_topology_preflight.py
          git commit -m "Prove declared annular contacts from kernel faces"
          git push origin HEAD:impl-074
