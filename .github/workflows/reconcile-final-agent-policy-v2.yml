name: Temporary reconcile final agent policy v2

on:
  push:
    branches:
      - docs/final-agent-policy-reconcile
    paths:
      - .github/workflows/reconcile-final-agent-policy-v2.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: docs/final-agent-policy-reconcile
          fetch-depth: 0
      - name: Reconcile final policy and remove helpers
        shell: bash
        env:
          RECONCILE_SCRIPT_B64: " 
        run: |
          set -euo pipefail
          printf '%s' "$RECONCILE_SCRIPT_B64" | base64 -d > /tmp/reconcile.py
          python /tmp/reconcile.py
          git rm .github/workflows/reconcile-final-agent-policy-v2.yml .github/workflows/reconcile-final-agent-policy.yml .github/workflows/tmp-final-agent-policy-reconcile.yml
          git config user.name "JarvisOS governance reconciler"
          git config user.email "actions@users.noreply.github.com"
          git add AGENTS.md docs/AGENT_EXECUTION_AND_AUTOMATION_PROTOCOL.md docs/POST_112_PARALLEL_DELIVERY_PROFILE.md docs/specs/STATUS.md
          git diff --cached --check
          git commit -m "Reconcile final agent delivery policy"
          git push origin HEAD:docs/final-agent-policy-reconcile
